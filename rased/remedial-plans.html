<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد | سجل الخطط العلاجية</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>:root{--navy:#073b68;--teal:#087461;--gold:#c99a45}*{box-sizing:border-box}body{margin:0;background:#f1f6fa;color:#19394d;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(110deg,#073b68,#087461);color:white;padding:25px;text-align:center}header img{width:76px;height:76px;object-fit:contain}header h1{margin:10px 0}main{max-width:1150px;margin:25px auto;padding:0 16px}.panel,.plan{background:#fff;border:1px solid #dce7ef;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 13px #103e5a0c}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{font-weight:bold;font-size:13px;display:block}select,input,textarea{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #cbdce6;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}button,.link{border:0;background:var(--teal);color:white;border-radius:9px;padding:10px 15px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}.secondary{background:#eaf1f6;color:#17465e}.danger{background:#a92e3c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.plan{border-top:5px solid var(--gold);margin:0}.plan h3{margin:0 0 12px;color:var(--navy)}.plan p{line-height:1.7}.meta{font-size:12px;color:#617789;line-height:1.9}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#e9f5f2;border-radius:12px;padding:13px 20px}.stat strong{display:block;font-size:23px;color:var(--teal)}footer{text-align:center;padding:24px;color:#718394}dialog{border:0;border-radius:15px;max-width:570px;width:94%;box-shadow:0 15px 50px #1235}dialog::backdrop{background:#0c294c88}@media(max-width:700px){.filters{grid-template-columns:repeat(2,1fr)}}@media print{.filters,.toolbar,.actions,dialog,.link{display:none!important}body{background:white}.plan{break-inside:avoid;box-shadow:none}header{background:white;color:var(--navy)}}@page{size:A4;margin:12mm}</style></head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1>سجل الخطط العلاجية</h1><p>الخطط المحفوظة بعد تحليل نتائج الطلاب — مدارس الفلاح الأهلية</p></header><main><section class="panel"><div class="filters"><label>الصف<select id="grade" onchange="refreshFilters()"></select></label><label>الفصل<select id="section" onchange="refreshFilters()"></select></label><label>الطالب<select id="student" onchange="render()"></select></label><label>المادة<select id="subject" onchange="render()"></select></label></div><div class="toolbar"><button onclick="loadPlans()">↻ تحديث الخطط</button><button class="secondary" onclick="window.print()">🖨 طباعة القائمة</button><a class="link secondary" href="academic-development.html">العودة للمنظومة</a><span id="status"></span></div></section><section class="stats" id="stats"></section><section class="cards" id="cards"><p>جارٍ تحميل الخطط المحفوظة...</p></section></main><dialog id="editor"><h2>تعديل الخطة العلاجية</h2><form id="editForm" onsubmit="saveEdit(event)"><label>المهارة الأولى<input id="skill" required></label><label>الإجراء العلاجي<textarea id="action" required></textarea></label><label>تاريخ بداية الخطة<input id="startDate" type="date"></label><label>مدة الخطة بالأسابيع<input id="weeks" type="number" min="1" max="52" value="4" required></label><div id="extraSkills"></div><button type="button" class="secondary" onclick="addSkill()">＋ إضافة مهارة أخرى</button><label>موعد المتابعة<input id="date" type="date" required></label><label>الحالة<select id="planStatus"><option value="active">نشطة</option><option value="completed">مكتملة</option><option value="followup">قيد المتابعة</option></select></label><div class="toolbar"><button type="submit">حفظ التعديل</button><button type="button" class="secondary" onclick="document.getElementById('editor').close()">إلغاء</button></div></form></dialog><footer>تصميم محمد عامر أحمد</footer><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const role=localStorage.getItem("currentUserRole")||"",actor=String(localStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||"").toLowerCase();const admin=["admin","superadmin","manager"].includes(role);let plans=[],visible=[],editing=null,assigned=[];
const option=(items,placeholder)=>'<option value="">'+placeholder+'</option>'+[...new Set(items.map(x=>String(x||"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar",{numeric:true})).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
function refreshFilters(){const g=el("grade").value;el("section").innerHTML=option(plans.filter(p=>!g||p.grade===g).map(p=>p.section),"كل الفصول");const f=el("section").value;el("student").innerHTML=option(plans.filter(p=>(!g||p.grade===g)&&(!f||p.section===f)).map(p=>p.studentName),"كل الطلاب");el("subject").innerHTML=option(plans.filter(p=>(!g||p.grade===g)&&(!f||p.section===f)).map(p=>p.subjectName),"كل المواد");render();}
function render(){const g=el("grade").value,f=el("section").value,n=el("student").value,s=el("subject").value;visible=plans.filter(p=>(!g||p.grade===g)&&(!f||p.section===f)&&(!n||p.studentName===n)&&(!s||p.subjectName===s));el("stats").innerHTML='<div class="stat"><strong>'+visible.length+'</strong>الخطط المعروضة</div><div class="stat"><strong>'+new Set(visible.map(p=>p.studentCode)).size+'</strong>الطلاب المستهدفون</div><div class="stat"><strong>'+visible.filter(p=>p.status==="completed").length+'</strong>الخطط المكتملة</div>';el("cards").innerHTML=visible.length?visible.map(p=>'<article class="plan"><h3>🎯 '+esc(p.studentName)+'</h3><div class="meta">'+esc(p.grade)+' / '+esc(p.section)+' — '+esc(p.subjectName)+'</div><p><b>المهارة:</b> '+esc(p.skill)+'</p><p><b>الإجراء:</b> '+esc(p.action)+'</p><div class="meta">الاختبار المرجعي: '+esc(p.baselineTestName||"—")+'<br>موعد المتابعة: '+esc(p.followupDate||"—")+' | الحالة: '+esc(p.status||"active")+'</div><div class="actions">'+(canEdit(p)?'<button data-action="edit" data-id="'+esc(p.id)+'">✏️ تعديل</button><button class="danger" data-action="delete" data-id="'+esc(p.id)+'">🗑 حذف</button>':'')+'<button data-action="print" data-id="'+esc(p.id)+'">🖨 طباعة</button></div></article>').join(""):'<div class="panel">لا توجد خطط علاجية محفوظة ضمن الاختيارات الحالية.</div>';}
function canEdit(p){return admin||((role==="teacher"||role==="supervisor")&&String(p.createdBy||"").toLowerCase()===actor);}
async function loadPlans(){el("status").textContent="جارٍ تحميل الخطط...";try{let q=db.collection("academicRemedialPlans");if(role==="teacher")q=q.where("createdBy","==",actor);const snap=await q.get();plans=snap.docs.map(d=>({id:d.id,...d.data()}));if(role==="supervisor")plans=plans.filter(p=>assigned.includes(String(p.createdBy||"").toLowerCase()));plans.sort((a,b)=>String(b.followupDate||"").localeCompare(String(a.followupDate||"")));el("grade").innerHTML=option(plans.map(p=>p.grade),"كل الصفوف");refreshFilters();el("status").textContent="تم تحميل "+plans.length+" خطة محفوظة.";}catch(e){el("status").textContent="تعذر تحميل الخطط: "+e.message;el("cards").textContent="تحقق من صلاحيات الوصول إلى سجل الخطط."}}
function addSkill(item={}){const w=document.createElement("div");w.className="extra";w.style.cssText="padding:12px;border:1px solid #ddd;border-radius:10px;margin:10px 0";w.innerHTML='<label>المهارة<input class="sk" required></label><label>الإجراء العلاجي<textarea class="ac" required></textarea></label><label>الأسبوع / الأسابيع<input class="wk" placeholder="مثال: 2-3"></label><button type="button" class="danger" onclick="this.parentElement.remove()">حذف المهارة</button>';el("extraSkills").appendChild(w);w.querySelector(".sk").value=item.skill||"";w.querySelector(".ac").value=item.action||"";w.querySelector(".wk").value=item.week||"";}
function skillItems(){return [{skill:el("skill").value.trim(),action:el("action").value.trim(),week:"1"},...Array.from(document.querySelectorAll("#extraSkills .extra")).map(w=>({skill:w.querySelector(".sk").value.trim(),action:w.querySelector(".ac").value.trim(),week:w.querySelector(".wk").value.trim()}))];}
function openEdit(id){const p=plans.find(x=>x.id===id);if(!p||!canEdit(p))return;editing=id;el("skill").value=p.skill||"";el("action").value=p.action||"";el("date").value=p.followupDate||"";el("startDate").value=p.startDate||"";el("weeks").value=p.durationWeeks||4;el("extraSkills").innerHTML="";(p.skillItems||[]).slice(1).forEach(addSkill);el("planStatus").value=["active","completed","followup"].includes(p.status)?p.status:"active";el("editor").showModal();}
async function saveEdit(e){e.preventDefault();const p=plans.find(x=>x.id===editing);if(!p||!canEdit(p))return;const items=skillItems(),weeks=Number(el("weeks").value);if(!Number.isInteger(weeks)||weeks<1||weeks>52||items.some(x=>!x.skill||!x.action)){alert("أكمل بيانات جميع المهارات والمدة.");return;}try{await db.collection("academicRemedialPlans").doc(editing).update({skillItems:items,durationWeeks:weeks,startDate:el("startDate").value,skill:el("skill").value.trim(),action:el("action").value.trim(),followupDate:el("date").value,status:el("planStatus").value,updatedBy:actor,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});el("editor").close();await loadPlans();}catch(err){alert("تعذر تعديل الخطة: "+err.message);}}
async function deletePlan(id){const p=plans.find(x=>x.id===id);if(!p||!canEdit(p)||!confirm("حذف خطة "+p.studentName+" نهائيًا؟"))return;try{await db.collection("academicRemedialPlans").doc(id).delete();await loadPlans();}catch(e){alert("تعذر الحذف: "+e.message);}}
function printPlan(id){const p=plans.find(x=>x.id===id);if(!p)return;const w=window.open("","_blank");if(!w){alert("اسمح بالنوافذ المنبثقة");return;}const fields=[["الطالب",p.studentName],["الصف والفصل",p.grade+" / "+p.section],["المادة",p.subjectName],["الاختبار المرجعي",p.baselineTestName],["المهارات والإجراءات",(p.skillItems||[{skill:p.skill,action:p.action}]).map((x,i)=>(i+1)+". "+x.skill+" — "+x.action+(x.week?" (الأسبوع "+x.week+")":"")).join(" | ")],["مدة الخطة",p.durationWeeks?p.durationWeeks+" أسابيع":"غير محددة"],["تاريخ البداية",p.startDate||"—"],["موعد المتابعة",p.followupDate],["الحالة",p.status]];w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الخطة العلاجية</title><style>@page{size:A4;margin:15mm}body{font:15px Tahoma,Arial;color:#17394c}.head{text-align:center;border-bottom:3px solid #c99a45;padding:12px}.head img{width:78px}table{width:100%;border-collapse:collapse;margin-top:18px}td{border:1px solid #d1e0e7;padding:11px}td:first-child{background:#f1f7f8;font-weight:bold;width:30%}.sign{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:35px;text-align:center}.sign div{border-top:2px solid #c99a45;padding:10px 2px}.sign small{display:block;margin-bottom:8px}footer{text-align:center;margin-top:35px}</style></head><body><div class="head"><img src="'+new URL("logo.jpeg",location.href).href+'"><h2>مدارس الفلاح الأهلية</h2><h1>الخطة العلاجية</h1></div><table>'+fields.map(f=>'<tr><td>'+esc(f[0])+'</td><td>'+esc(f[1])+'</td></tr>').join("")+'</table><div class="sign">'+[['معلم المادة',p.teacherName||"غير محدد"],['المشرف التربوي',p.supervisorName||"غير محدد"],['المشرف العام',p.generalSupervisorName||"أحمد سمير عباس"],['مدير المدرسة',p.principalName||"عبد العزيز بن إبراهيم القحطاني"]].map(f=>'<div><small>'+esc(f[0])+'</small><b>'+esc(f[1])+'</b></div>').join("")+'</div><footer>تصميم محمد عامر أحمد</footer></body></html>');w.document.close();w.addEventListener("load",()=>w.print(),{once:true});}
el("cards").addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id;if(b.dataset.action==="edit")openEdit(id);if(b.dataset.action==="delete")deletePlan(id);if(b.dataset.action==="print")printPlan(id);});
async function init(){if(!["admin","superadmin","manager","teacher","supervisor"].includes(role)){location.replace("index.html");return;}if(role==="supervisor"){try{const snap=await db.collection("users").get();const me=snap.docs.find(d=>String(d.id).toLowerCase()===actor||String(d.data().email||"").toLowerCase()===actor);assigned=(me?.data().assignedTeacherEmails||[]).map(x=>String(x).toLowerCase());if(!me){el("status").textContent="لم يمكن التحقق من تكليف المشرف";return;}}catch(e){el("status").textContent="تعذر التحقق من صلاحيات المشرف: "+e.message;return;}}await loadPlans();}init();
</script></body></html>
