<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طباعة كشف الدرجات | راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f7f9;color:#193b48;margin:0}header{background:#075344;color:white;text-align:center;padding:18px}header img{height:75px;width:75px;object-fit:contain;background:white;border-radius:10px}h1{font-size:23px;margin:9px 0}main{max-width:1080px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #d8e5e9;border-radius:12px;margin-bottom:15px;padding:18px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}label{font-weight:bold}select{width:100%;display:block;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #b9cbd4}button,a.btn{font:700 13px Tahoma;border:0;border-radius:8px;background:#08745a;color:white;display:inline-block;padding:11px 17px;margin:13px 5px 0;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}#msg{padding:12px;background:#e8f4f0;margin:12px 0;border-radius:8px}table{border-collapse:collapse;width:100%;margin-top:14px}th,td{border:1px solid #b9c6ca;padding:10px;text-align:center;font-size:13px}th{background:#e7f0ed}td:nth-child(2){text-align:right}.hidden{display:none}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;line-height:2}@media(max-width:650px){.filters{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:12mm}body{background:white}.no-print{display:none!important}header{color:#183a34;background:white}.card{border:0;padding:5px}tr{break-inside:avoid}th{background:#eee!important}} .credit{font-size:11px;color:#6b7f83;text-align:center;margin:12px auto 0;font-weight:bold}.result-heading{margin:0 0 12px;text-align:center}@media print{@page{size:A4 landscape;margin:4mm}header{padding:2px!important;border-bottom:1px solid #b5c5bf}header img{width:40px!important;height:40px!important}header h1{font-size:14px!important;margin:2px!important}header div{font-size:11px}main{max-width:none;margin:2px auto;padding:0}.card{margin:0;border:0;padding:0}#result h2{font-size:13px;margin:3px 0!important}.meta{font-size:9px;gap:3px;line-height:1.1}table{margin-top:3px;table-layout:fixed}th,td{padding:var(--print-pad,1px) 3px;font-size:var(--print-font,9px);line-height:1}th:nth-child(1),td:nth-child(1){width:7%}th:nth-child(2),td:nth-child(2){width:53%}th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){width:20%}#note{font-size:10px;margin:4px 0}.credit{position:static;border-top:1px solid #cfd8d4;padding-top:4px;margin-top:8px;color:#365c53}header{break-after:avoid}thead{display:table-header-group}tr{break-inside:avoid}table,#result{break-inside:auto}} </style>
<link rel="stylesheet" href="rased-theme.css">
</head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1>كشف درجات اختبار مرصود</h1><div>مدارس الفلاح الأهلية — نظام راصد</div></header><main><div class="no-print"><a class="btn" href="supervisor-dashboard.html">العودة إلى المشرف</a></div><section class="card no-print"><h2>اختيار المعلم ثم بيانات الكشف</h2><div class="filters"><label>المعلم<select id="teacher"><option value="">اختر المعلم</option></select></label><label>الصف<select id="grade" disabled><option value="">اختر الصف</option></select></label><label>الشعبة<select id="section" disabled><option value="">اختر الشعبة</option></select></label><label>المادة<select id="subject" disabled><option value="">اختر المادة</option></select></label><label>الاختبار<select id="test" disabled><option value="">اختر الاختبار</option></select></label></div><button id="view">عرض درجات الاختبار</button><button id="print" disabled>طباعة الكشف</button><div id="msg">جارٍ التحقق من صلاحية المشرف...</div></section><section class="card hidden" id="result"><h2 style="text-align:center">كشف درجات الاختبار</h2><div id="meta" class="meta"></div><table><thead><tr><th>م</th><th>اسم الطالب</th><th>الدرجة</th><th>الدرجة النهائية</th></tr></thead><tbody id="rows"></tbody></table><p id="note"></p></section><div class="credit">تصميم محمد عامر أحمد</div></main><script>
const config={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd"};firebase.initializeApp(config);const db=firebase.firestore(),el=id=>document.getElementById(id),norm=x=>String(x??"").trim().toLowerCase(),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let classes=[],tests=[],students=[],actor="",teachersForSheet=[],teacherOptions=[],selectedTeacher=null;
function msg(t){el("msg").textContent=t}function fill(id,items,placeholder){const s=el(id),old=s.value;s.replaceChildren(new Option(placeholder,""));items.forEach(x=>s.add(new Option(x.label,x.value)));if(items.some(x=>x.value===old))s.value=old}
function allowedClass(g,c){return classes.some(x=>x.teacherKey===selectedTeacher?.key&&x.grade===g&&x.section===c)}
function resetDependent(){["grade","section","subject","test"].forEach(id=>{el(id).replaceChildren(new Option(id==="grade"?"اختر الصف":id==="section"?"اختر الشعبة":id==="subject"?"اختر المادة":"اختر الاختبار","") );el(id).disabled=true});el("result").classList.add("hidden");el("print").disabled=true}
function refresh(){
 const teacherKey=el("teacher").value;selectedTeacher=teacherOptions.find(x=>x.key===teacherKey)||null;
 if(!selectedTeacher){resetDependent();return}
 const own=classes.filter(x=>x.teacherKey===teacherKey);
 const gs=[...new Set(own.map(x=>x.grade))].sort((a,b)=>a.localeCompare(b,"ar",{numeric:true}));
 el("grade").disabled=false;fill("grade",gs.map(x=>({value:x,label:x})),"اختر الصف");
 const grade=el("grade").value;const ownGrade=own.filter(x=>x.grade===grade);
 el("section").disabled=!grade;fill("section",[...new Set(ownGrade.map(x=>x.section))].map(x=>({value:x,label:x})),"اختر الشعبة");
 const sec=el("section").value;const ownSection=ownGrade.filter(x=>x.section===sec);
 el("subject").disabled=!sec;const subjects=[...new Map(ownSection.map(x=>[x.subjectId,{value:x.subjectId,label:x.subjectName||x.subjectId}])).values()];fill("subject",subjects,"اختر المادة");
 const subject=el("subject").value;const list=tests.filter(t=>t.subjectId&&norm(t.subjectId)===norm(subject)&&Array.isArray(t.classes)&&t.classes.some(c=>c.grade===grade&&c.section===sec));
 el("test").disabled=!subject;fill("test",list.map(t=>({value:t.id,label:(t.name||"اختبار")+" — "+(t.date||"")})),"اختر الاختبار");el("result").classList.add("hidden");el("print").disabled=true;
}
async function init(){try{const role=norm(localStorage.getItem("currentUserRole")||sessionStorage.getItem("currentUserRole"));actor=norm(localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||sessionStorage.getItem("currentUser"));if(role!=="supervisor"||!actor)throw Error("هذه الصفحة للمشرفين المصرح لهم فقط");const user=await db.collection("users").doc(actor).get();if(!user.exists||norm(user.data().role)!=="supervisor"||user.data().permissions?.gradeSheetPrint!==true)throw Error("ليس لديك صلاحية طباعة كشوف الدرجات. اطلب تفعيلها من الإدارة.");const x=user.data(),ids=[...new Set((x.assignedTeacherEmails||[]).map(norm))];const legacy=await db.collection("supervisors").doc(actor).get();if(legacy.exists)(legacy.data().teachers||[]).forEach(v=>ids.push(norm(v)));const allowedIds=[...new Set(ids)];if(!allowedIds.length)throw Error("لا يوجد معلمون مسندون إلى هذا المشرف.");const [ts,es,ss]=await Promise.all([db.collection("teachers").get(),db.collection("tests").get(),db.collection("students").get()]);ts.docs.forEach(d=>{const t=d.data(),key=norm(d.id||t.email);if(!allowedIds.includes(key)&&!allowedIds.includes(norm(t.email)))return;const teacher={key,name:String(t.name||t.email||d.id||""),email:norm(t.email||d.id)};teacherOptions.push(teacher);(t.assignments||[]).forEach(a=>{if(a.grade&&a.section&&a.subjectId)classes.push({teacherKey:key,teacherEmail:teacher.email,teacherName:teacher.name,grade:String(a.grade),section:String(a.section),subjectId:norm(a.subjectId),subjectName:String(a.subjectName||a.subject||a.subjectId)});teachersForSheet.push(teacher)});});teacherOptions=[...new Map(teacherOptions.map(x=>[x.key,x])).values()].sort((a,b)=>a.name.localeCompare(b.name,"ar"));fill("teacher",teacherOptions.map(x=>({value:x.key,label:x.name})),"اختر المعلم");tests=es.docs.map(d=>({id:d.id,...d.data()}));students=ss.docs.map(d=>({id:d.id,...d.data()}));resetDependent();msg("اختر المعلم أولًا، ثم الصف والشعبة والمادة والاختبار.")}catch(e){msg("تعذر فتح الكشف: "+e.message);["teacher","grade","section","subject","test","view"].forEach(id=>el(id).disabled=true)}}
async function show(){const teacherKey=el("teacher").value,g=el("grade").value,c=el("section").value,subjectId=el("subject").value,id=el("test").value,t=tests.find(x=>x.id===id);const assignment=classes.find(x=>x.teacherKey===teacherKey&&x.grade===g&&x.section===c&&x.subjectId===norm(subjectId));if(!selectedTeacher||!t||!assignment||norm(t.subjectId)!==norm(subjectId)||(t.classes||[]).some(x=>x.grade===g&&x.section===c)===false)return msg("اختر بيانات داخل نطاق المعلم المحدد.");el("view").disabled=true;try{const snap=await db.collection("grades").where("testId","==",id).get(),marks=new Map();snap.forEach(d=>{const x=d.data(),markTeacher=norm(x.teacherEmail||x.teacherId),markName=norm(x.teacherName);if(markTeacher&&(markTeacher!==selectedTeacher.email&&markTeacher!==selectedTeacher.key)||(!markTeacher&&markName&&markName!==norm(selectedTeacher.name)))return;if(String(x.grade)===g&&String(x.section)===c)marks.set(String(x.studentCode),x)});const roster=students.filter(x=>String(x.grade)===g&&String(x.section)===c).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ar"));el("rows").innerHTML=roster.map((st,i)=>{const m=marks.get(String(st.code)),value=!m?"لم يُرصد":m.attendance==="absent"?"غائب":m.mark===null||m.mark===undefined||m.mark===""?"لم يُرصد":esc(m.mark);return "<tr><td>"+(i+1)+"</td><td>"+esc(st.name)+"</td><td>"+value+"</td><td>"+esc(t.fullMark||"—")+"</td></tr>"}).join("")||'<tr><td colspan="4">لا يوجد طلاب في هذا الفصل</td></tr>';el("meta").innerHTML="<span>المعلم: <b>"+esc(selectedTeacher.name)+"</b></span><span>الصف: <b>"+esc(g)+"</b> | الشعبة: <b>"+esc(c)+"</b></span><span>المادة: <b>"+esc(assignment.subjectName||t.subjectName||"")+"</b> | الاختبار: <b>"+esc(t.name||"")+"</b></span><span>تاريخ الاختبار: "+esc(t.date||"—")+"</span>";el("note").textContent="عدد الطلاب: "+roster.length+" | درجات مرصودة: "+[...marks.values()].filter(x=>x.attendance==="absent"||x.mark!==null&&x.mark!==undefined&&x.mark!=="").length+" | الخانات غير المرصودة لا تُحسب صفرًا.";el("result").classList.remove("hidden");const n=roster.length;document.documentElement.style.setProperty("--print-font",n>24?"8px":n>16?"9px":n>8?"10px":"11px");document.documentElement.style.setProperty("--print-pad",n>24?"0px":n>16?"1px":"2px");el("print").disabled=false;msg("تم تحميل كشف المعلم المحدد. يمكنك الآن طباعته.")}catch(e){msg("تعذر قراءة درجات الاختبار: "+e.message)}finally{el("view").disabled=false}}
el("teacher").addEventListener("change",refresh);el("grade").addEventListener("change",refresh);el("section").addEventListener("change",refresh);el("subject").addEventListener("change",refresh);el("view").addEventListener("click",show);el("print").addEventListener("click",()=>window.print());init();
</script></body></html>
