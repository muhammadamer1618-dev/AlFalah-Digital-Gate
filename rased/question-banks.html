<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنوك الأسئلة | راصد</title><style>body{margin:0;background:#f1f6fb;font-family:Tahoma,Arial;color:#153956}header{background:linear-gradient(120deg,#073b5c,#087e9b);color:white;text-align:center;padding:25px}header img{height:82px;width:82px;object-fit:contain;background:white;border-radius:50%;padding:5px}main{max-width:1050px;margin:25px auto;padding:0 15px}.panel,.item{background:white;border:1px solid #dce8f2;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 22px #17486b12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{display:block;font-weight:bold;margin:10px 0 5px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbddeb;border-radius:10px}button,a.action{display:inline-block;border:0;background:#0874a3;color:white;border-radius:10px;padding:11px 17px;cursor:pointer;text-decoration:none;margin:5px}button.danger{background:#b52d42}.muted{color:#627c92}#message{padding:12px}footer{text-align:center;color:#56748c;padding:24px}.file-card{border-top:4px solid #0d9993}.file-card h3{margin:6px 0}</style></head><body><header><img src="logo.jpeg" alt="شعار مدارس الفلاح"><h1>📚 بنوك الأسئلة</h1><p>مدارس الفلاح الأهلية | نظام راصد</p></header><main><p><a href="javascript:history.back()">← العودة</a></p><div id="message" class="muted">جارٍ تحميل البيانات...</div><section id="editor" class="panel" hidden><h2>رفع أوراق العمل</h2><div class="grid"><div><label>عنوان ورقة العمل</label><input id="title" maxlength="130"></div><div><label>المادة</label><input id="subject" placeholder="مثال: اللغة الإنجليزية"></div><div><label>الصف</label><input id="grade" placeholder="مطابق لبيانات الطلاب"></div><div><label>الشعبة</label><input id="section" placeholder="مثال: أ"></div><div><label>أكواد الطلاب المحددين (اختياري)</label><input id="studentCodes" placeholder="110, 111"></div><div><label>طريقة التخصيص</label><select id="targetMode"><option value="class">الصف والشعبة بالكامل</option><option value="students">طلاب محددون فقط</option><option value="both">الصف والشعبة وطلاب محددون</option></select></div><div><label>ملف ورقة العمل (PDF / Word / Image)</label><input id="file" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"></div></div><button id="upload" onclick="uploadSheet()">رفع ونشر</button><p class="muted">الحد الأقصى 10 MB. لا تشارك ملفات تحتوي على بيانات شخصية حساسة.</p></section><section class="panel"><h2 id="listTitle">أوراق العمل</h2><div id="list" class="grid"></div></section></main><footer>تصميم محمد عامر أحمد — راصد 2026</footer><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script><script>
firebase.initializeApp({apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"});
const db=firebase.firestore(),storage=firebase.storage(),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const studentMode=location.hostname.startsWith("student."),user=()=>String(sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUser")||localStorage.getItem("currentUser")||"").trim().toLowerCase();
const role=()=>String(sessionStorage.getItem("currentUserRole")||localStorage.getItem("currentUserRole")||"").toLowerCase();
const msg=(s)=>$("message").textContent=s;
let student=null,staff=null;
const norm=v=>String(v||"").trim().replace(/[أإآ]/g,"ا").replace(/\s+/g," ").toLowerCase();
function matches(x,s){const code=String(s.code||s.loginCode||"").trim(),ids=(x.studentCodes||[]).map(String),grade=norm(x.grade)===norm(s.grade),section=norm(x.section)===norm(s.section),inClass=grade&&section,inList=ids.includes(code);return x.targetMode==="students"?inList:x.targetMode==="both"?(inClass||inList):inClass}
async function init(){try{
 if(studentMode){student=JSON.parse(localStorage.getItem("rased.student.session.v1")||"null");if(!student||student.expiresAt&&Number(student.expiresAt)<Date.now())throw Error("يرجى تسجيل الدخول من بوابة الطالب");if(!student.grade||!student.section){let d=await db.collection("students").doc(student.docId||student.code).get();if(d.exists)student={...student,...d.data()}}}
 else{if(!user())throw Error("يرجى تسجيل الدخول إلى راصد أولًا");const d=await db.collection("users").doc(user()).get();staff=d.exists?d.data():{};const supervisor=/supervisor|manager|admin|deputy/.test(role());if(supervisor&&staff.permissions?.questionBanksView!==true&&role()!=="admin")throw Error("لا توجد صلاحية متابعة بنوك الأسئلة لهذا الحساب");if(!supervisor){$("editor").hidden=false;$("listTitle").textContent="أوراق العمل المرفوعة"}}
 await load();}catch(e){msg(e.message)}}
async function load(){const snap=await db.collection("questionBankSheets").limit(250).get();let items=snap.docs.map(d=>({id:d.id,...d.data()}));if(studentMode)items=items.filter(x=>x.published!==false&&matches(x,student));else if(!/supervisor|manager|admin|deputy/.test(role()))items=items.filter(x=>x.teacherId===user());items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("list").innerHTML=items.length?items.map(x=>'<article class="item file-card"><h3>📄 '+esc(x.title)+'</h3><p>📘 '+esc(x.subject)+' · '+esc(x.teacherName||x.teacherId)+'</p><p class="muted">'+esc(x.grade)+' / '+esc(x.section)+'</p><a class="action" href="'+esc(x.fileUrl)+'" target="_blank" rel="noopener">👁 عرض / ⬇ تحميل</a>'+(!studentMode&&x.teacherId===user()?'<button class="danger" onclick="removeSheet('+JSON.stringify(x.id).replace(/"/g,"&quot;")+')">حذف</button>':'')+'</article>').join(""):'<p class="muted">لا توجد أوراق عمل متاحة حاليًا.</p>';msg("تم تحميل "+items.length+" ورقة عمل")}
async function uploadSheet(){if(studentMode||!user())return;const file=$("file").files[0],title=$("title").value.trim(),subject=$("subject").value.trim(),grade=$("grade").value.trim(),section=$("section").value.trim(),mode=$("targetMode").value,codes=$("studentCodes").value.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);if(!file||!title||!subject||(mode!=="students"&&(!grade||!section))||(mode!=="class"&&!codes.length))return msg("أكمل بيانات الورقة والمستفيدين");if(file.size>10*1024*1024||!(/\.(pdf|docx?|png|jpe?g)$/i.test(file.name)))return msg("الملف غير مدعوم أو يتجاوز 10 MB");$("upload").disabled=true;try{msg("جارٍ رفع الملف...");const path="question-bank/"+encodeURIComponent(user())+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const ref=storage.ref(path);await ref.put(file);const url=await ref.getDownloadURL();await db.collection("questionBankSheets").add({title,subject,grade,section,targetMode:mode,studentCodes:codes,teacherId:user(),teacherName:staff?.name||user(),fileUrl:url,storagePath:path,published:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("file").value="";await load()}catch(e){msg("تعذر الرفع: "+e.message)}finally{$("upload").disabled=false}}
async function removeSheet(id){if(!confirm("حذف ورقة العمل؟"))return;try{const ref=db.collection("questionBankSheets").doc(id),doc=await ref.get();if(!doc.exists||doc.data().teacherId!==user())return;await ref.delete();if(doc.data().storagePath)await storage.ref(doc.data().storagePath).delete().catch(()=>{});await load()}catch(e){msg("تعذر الحذف: "+e.message)}}
init();</script></body></html>
