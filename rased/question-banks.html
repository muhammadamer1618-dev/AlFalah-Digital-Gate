<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنوك الأسئلة | راصد</title><style>body{margin:0;background:#f1f6fb;font-family:Tahoma,Arial;color:#153956}header{background:linear-gradient(120deg,#073b5c,#087e9b);color:white;text-align:center;padding:25px}header img{height:82px;width:82px;object-fit:contain;background:white;border-radius:50%;padding:5px}main{max-width:1050px;margin:25px auto;padding:0 15px}.panel,.item{background:white;border:1px solid #dce8f2;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 22px #17486b12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{display:block;font-weight:bold;margin:10px 0 5px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbddeb;border-radius:10px}button,a.action{display:inline-block;border:0;background:#0874a3;color:white;border-radius:10px;padding:11px 17px;cursor:pointer;text-decoration:none;margin:5px}button.danger{background:#b52d42}.muted{color:#627c92}#message{padding:12px}footer{text-align:center;color:#56748c;padding:24px}.file-card{border-top:4px solid #0d9993}.file-card h3{margin:6px 0}</style></head><body><header><img src="logo.jpeg" alt="شعار مدارس الفلاح"><h1>📚 بنوك الأسئلة</h1><p>مدارس الفلاح الأهلية | نظام راصد</p></header><main><p><a href="javascript:history.back()">← العودة</a></p><div id="message" class="muted">جارٍ تحميل البيانات...</div><section id="editor" class="panel" hidden><h2>رفع أوراق العمل</h2><div class="grid"><div><label>عنوان ورقة العمل</label><input id="title" maxlength="130" placeholder="مثال: Unit 2 Worksheet"></div><div><label>المادة المسندة لك</label><select id="subject" onchange="updateAssignedClasses()"></select></div><div><label>الصف والشعبة المسندان لك</label><select id="classroom" onchange="syncAssignedClass()"></select></div><div><label>ملف ورقة العمل (PDF / Word / صورة)</label><input id="file" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"></div><input id="grade" type="hidden"><input id="section" type="hidden"><input id="targetMode" type="hidden" value="class"><input id="studentCodes" type="hidden" value=""></div><input id="editingSheet" type="hidden"><button id="upload" onclick="uploadSheet()">رفع ونشر</button><button id="cancelEdit" style="display:none;background:#667" onclick="resetSheetForm()">إلغاء التعديل</button><div id="uploadProgress" style="display:none;margin:10px 0"><progress id="uploadBar" max="100" value="0" style="width:100%"></progress><span id="uploadPercent">0%</span><button onclick="cancelSheetUpload()" style="background:#a33">إلغاء الرفع</button></div><p class="muted">الحد الأقصى 10 MB. لا تشارك ملفات تحتوي على بيانات شخصية حساسة.</p></section><section class="panel"><h2 id="listTitle">أوراق العمل</h2><div id="list" class="grid"></div></section></main><footer>تصميم محمد عامر أحمد — راصد 2026</footer><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
firebase.initializeApp({apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"});
const QUESTION_BANK_SETUP_REQUIRED=false;const db=firebase.firestore(),supabaseClient=window.supabase.createClient("https://xalqjwuewdgxrxuejqyg.supabase.co","sb_publishable_BJozLqjByOtWcLi3Zb_MPg_pzNwV8jb"),SUPABASE_BUCKET="rased-files",$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const studentMode=location.hostname.startsWith("student."),user=()=>String(sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUser")||localStorage.getItem("currentUser")||"").trim().toLowerCase();
const role=()=>String(sessionStorage.getItem("currentUserRole")||localStorage.getItem("currentUserRole")||"").toLowerCase();
const msg=(s)=>$("message").textContent=s;
let student=null,staff=null;
const norm=v=>String(v||"").trim().replace(/[أإآ]/g,"ا").replace(/\s+/g," ").toLowerCase();
function matches(x,s){const code=String(s.code||s.loginCode||"").trim(),ids=(x.studentCodes||[]).map(String),grade=norm(x.grade)===norm(s.grade),section=norm(x.section)===norm(s.section),inClass=grade&&section,inList=ids.includes(code);return x.targetMode==="students"?inList:x.targetMode==="both"?(inClass||inList):inClass}
let assignedClasses=[];
async function loadTeacherAssignments(){
 const doc=await db.collection("teachers").doc(user()).get();
 if(!doc.exists)throw Error("لم يتم العثور على بيانات المعلم المسجلة");
 staff={...staff,...doc.data()};
 assignedClasses=(doc.data().assignments||[]).filter(a=>a.grade&&a.section&&a.subjectId);
 if(!assignedClasses.length)throw Error("لا توجد فصول مسندة لهذا المعلم. راجع إسناد الفصول في الأدمن.");
 const subjects=[...new Map(assignedClasses.map(a=>[String(a.subjectId),a.subjectName||a.subject||a.subjectId])).entries()];
 $("subject").innerHTML=subjects.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join("");
 updateAssignedClasses();
}
function updateAssignedClasses(){
 const rows=assignedClasses.filter(a=>String(a.subjectId)===$("subject").value);
 $("classroom").innerHTML=rows.map((a,i)=>'<option value="'+i+'">'+esc(a.grade+' — '+a.section)+'</option>').join("");
 syncAssignedClass();
}
function syncAssignedClass(){
 const rows=assignedClasses.filter(a=>String(a.subjectId)===$("subject").value);
 const a=rows[Number($("classroom").value)];if(!a)return;
 $("grade").value=a.grade;$("section").value=a.section;
}
async function init(){try{
 if(studentMode){student=JSON.parse(localStorage.getItem("rased.student.session.v1")||"null");if(!student||student.expiresAt&&Number(student.expiresAt)<Date.now())throw Error("يرجى تسجيل الدخول من بوابة الطالب");if(!student.grade||!student.section){let d=await db.collection("students").doc(student.docId||student.code).get();if(d.exists)student={...student,...d.data()}}}
 else{if(!user())throw Error("يرجى تسجيل الدخول إلى راصد أولًا");const d=await db.collection("users").doc(user()).get();staff=d.exists?d.data():{};const supervisor=/supervisor|manager|admin|deputy/.test(role());if(supervisor&&staff.permissions?.questionBanksView!==true&&role()!=="admin")throw Error("لا توجد صلاحية متابعة بنوك الأسئلة لهذا الحساب");if(!supervisor){await loadTeacherAssignments();$("editor").hidden=false;$("listTitle").textContent="أوراق العمل المرفوعة"}}
 if(QUESTION_BANK_SETUP_REQUIRED){if(!studentMode&&$("editor").hidden===false){$("upload").disabled=true;$("upload").textContent="النشر متوقف لحين تفعيل حماية الملفات"}msg("يمكن إعداد بيانات ورقة العمل واختيار المستفيدين، لكن رفع الملفات متوقف مؤقتًا لحين تأمين الوصول.");return}await load();}catch(e){msg(e.message)}}
async function load(){const snap=await db.collection("questionBankSheets").limit(250).get();let items=snap.docs.map(d=>({id:d.id,...d.data()}));if(studentMode)items=items.filter(x=>x.published!==false&&matches(x,student));else if(!/supervisor|manager|admin|deputy/.test(role()))items=items.filter(x=>x.teacherId===user());visibleSheets=items;items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("list").innerHTML=items.length?items.map(x=>'<article class="item file-card"><h3>📄 '+esc(x.title)+'</h3><p>📘 '+esc(x.subject)+' · '+esc(x.teacherName||x.teacherId)+'</p><p class="muted">'+esc(x.grade)+' / '+esc(x.section)+'</p><a class="action" href="'+esc(x.fileUrl)+'" target="_blank" rel="noopener">👁 عرض / ⬇ تحميل</a>'+(!studentMode&&x.teacherId===user()?'<button onclick="editSheet('+JSON.stringify(x.id).replace(/"/g,"&quot;")+')">✏️ تعديل</button><button class="danger" onclick="removeSheet('+JSON.stringify(x.id).replace(/"/g,"&quot;")+')">حذف</button>':'')+'</article>').join(""):'<p class="muted">لا توجد أوراق عمل متاحة حاليًا.</p>';msg("تم تحميل "+items.length+" ورقة عمل")}
let currentUploadTask=null,visibleSheets=[];
function resetSheetForm(){$("editingSheet").value="";$("title").value="";$("file").value="";$("upload").textContent="رفع ونشر";$("cancelEdit").style.display="none"}
function editSheet(id){const x=visibleSheets.find(v=>v.id===id);if(!x||x.teacherId!==user())return msg("غير مسموح بتعديل هذه الورقة");$("editingSheet").value=id;$("title").value=x.title||"";const subject=assignedClasses.find(a=>(a.subjectName||a.subject||a.subjectId)===x.subject&&String(a.grade)===String(x.grade)&&String(a.section)===String(x.section));if(subject){$("subject").value=String(subject.subjectId);updateAssignedClasses();const rows=assignedClasses.filter(a=>String(a.subjectId)===$("subject").value);$("classroom").value=String(rows.findIndex(a=>String(a.grade)===String(x.grade)&&String(a.section)===String(x.section)));syncAssignedClass()}$("upload").textContent="حفظ التعديلات";$("cancelEdit").style.display="inline-block";$("editor").scrollIntoView({behavior:"smooth"});msg("يمكن تعديل العنوان والفصل أو اختيار ملف بديل. اترك الملف فارغًا للاحتفاظ بالملف الحالي.")}
function cancelSheetUpload(){msg("طلب الإلغاء غير متاح أثناء إرسال الملف إلى Supabase. انتظر انتهاء الطلب أو انتهاء مهلة الاتصال.")}
async function uploadWithProgress(filePath,file){
 $("uploadProgress").style.display="block";$("uploadBar").removeAttribute("value");$("uploadPercent").textContent="Uploading...";
 msg("جارٍ إرسال الملف إلى Supabase...");
 const {data,error}=await Promise.race([
  supabaseClient.storage.from(SUPABASE_BUCKET).upload(filePath,file,{upsert:false,contentType:file.type||"application/octet-stream"}),
  new Promise((_,reject)=>setTimeout(()=>reject(new Error("انتهت مهلة الاتصال بـ Supabase بعد 45 ثانية")),45000))
 ]);
 if(error)throw error;
 $("uploadBar").value=100;$("uploadPercent").textContent="100%";
 const publicUrl=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(data.path)?.data?.publicUrl;
 if(!publicUrl)throw Error("لم يتم إنشاء رابط الملف");
 return {url:publicUrl,path:data.path};
}
async function uploadSheet(){
 if(studentMode||!user())return;syncAssignedClass();
 const file=$("file").files[0],title=$("title").value.trim(),subject=assignedClasses.find(a=>String(a.subjectId)===$("subject").value)?.subjectName||$("subject").selectedOptions[0]?.textContent||"",grade=$("grade").value.trim(),section=$("section").value.trim(),id=$("editingSheet").value;
 if(!title||!subject||!grade||!section||(!id&&!file))return msg("اختر المادة والفصل واكتب العنوان وحدد الملف");
 if(file&&(file.size>10*1024*1024||!(/[.](pdf|docx?|png|jpe?g)$/i.test(file.name))))return msg("الملف غير مدعوم أو يتجاوز 10 MB");
 $("upload").disabled=true;let newPath=null;
 try{
 let old=null;if(id){const d=await db.collection("questionBankSheets").doc(id).get();if(!d.exists||d.data().teacherId!==user())throw Error("غير مسموح بتعديل هذه الورقة");old=d.data()}
 const data={title,subject,grade,section,targetMode:"class",studentCodes:[],teacherId:user(),teacherName:staff?.name||staff?.fullName||user(),published:true};
 if(file){newPath="question-bank/"+encodeURIComponent(user())+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const uploaded=await uploadWithProgress(newPath,file);data.fileUrl=uploaded.url;data.storagePath=uploaded.path;data.storageProvider="supabase"}
 if(id){await db.collection("questionBankSheets").doc(id).update({...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});if(file&&old?.storagePath)supabaseClient.storage.from(SUPABASE_BUCKET).remove([old.storagePath]).catch(()=>{})}
 else await db.collection("questionBankSheets").add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
 resetSheetForm();msg(id?"تم تعديل ورقة العمل بنجاح":"تم رفع ونشر ورقة العمل بنجاح");await load();
 }catch(e){msg("فشل الرفع أو الحفظ: "+(e.code||"")+" "+e.message+" — تحقق من اتصال الإنترنت وصلاحيات Firebase Storage");if(newPath)supabaseClient.storage.from(SUPABASE_BUCKET).remove([newPath]).catch(()=>{})}
 finally{currentUploadTask=null;$("uploadProgress").style.display="none";$("upload").disabled=false}
}
async function removeSheet(id){if(!confirm("حذف ورقة العمل؟"))return;try{const ref=db.collection("questionBankSheets").doc(id),doc=await ref.get();if(!doc.exists||doc.data().teacherId!==user())return;await ref.delete();if(doc.data().storagePath)await supabaseClient.storage.from(SUPABASE_BUCKET).remove([doc.data().storagePath]).catch(()=>{});await load()}catch(e){msg("تعذر الحذف: "+e.message)}}
init();</script></body></html>
