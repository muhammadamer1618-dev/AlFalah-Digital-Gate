<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشف مفرغ عام | راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f2f7f4;color:#16463a;margin:0}header{background:#075540;color:white;text-align:center;padding:14px}header img{height:60px;width:60px;object-fit:contain;background:white;border-radius:9px}h1{font-size:22px;margin:6px}main{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:white;border:1px solid #d4e3db;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:bold}input,select{width:100%;padding:9px;margin:7px 0;border:1px solid #b7cfc2;border-radius:7px;font:14px Tahoma}button,.btn{background:#087356;color:white;border:0;border-radius:8px;padding:11px 15px;font:700 13px Tahoma;cursor:pointer;display:inline-block;margin:8px 3px;text-decoration:none}.msg{background:#e8f4ee;padding:10px;border-radius:8px;margin:10px 0}.hidden{display:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #80978b;text-align:center;padding:8px;font-size:13px}th{background:#e1ede6}td.name{text-align:right;font-weight:bold;width:42%}th.serial,td.serial{width:30px;min-width:30px;max-width:30px;white-space:nowrap;word-break:normal}.dynamic-col{width:auto}.title{text-align:center;font-size:19px;margin:9px 0}.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;margin:10px 0}.foot{text-align:center;font-weight:bold;color:#688177;font-size:11px;margin:15px}.headers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.headers label{font-size:12px}@media(max-width:650px){.grid,.headers{grid-template-columns:1fr 1fr}}@media print{@page{size:A4 landscape;margin:5mm}body{background:white}header{padding:1mm 0;background:white!important;color:#183c30;border-bottom:1px solid #a9c2b3;break-after:avoid}header img{width:30px;height:30px}header h1{font-size:13px;margin:1px}main{margin:0 auto;max-width:none;padding:0;width:100%}.no-print{display:none!important}.card{border:0;padding:0;margin:0}.title{font-size:15px;margin:4px}.meta{font-size:9px;margin:2mm 0}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{font-size:var(--print-font,9px);padding:1px 2px!important;height:var(--print-row-height,6mm);line-height:1.12;vertical-align:middle;overflow-wrap:anywhere}th{height:6mm;background:white!important;color:#222!important}th.serial,td.serial{width:8mm!important;min-width:8mm!important;max-width:8mm!important;white-space:nowrap!important;word-break:normal!important;overflow-wrap:normal!important;font-variant-numeric:tabular-nums}th.student-name,td.name{width:43%!important;text-align:right;overflow-wrap:break-word;word-break:normal}td.name{font-size:var(--name-font,9px);font-weight:700}.scroll{overflow:visible!important}.foot{margin:2mm 0 0;font-size:8px}tr{break-inside:avoid;page-break-inside:avoid}thead{display:table-header-group}tbody tr:nth-child(30n){break-after:page;page-break-after:auto}#sheet{break-inside:auto}html,body{height:auto!important;overflow:visible!important}#alfalah-designer-credit{display:none!important}}</style>
<link rel="stylesheet" href="rased-theme.css">
</head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1 id="headerTitle">كشف مفرغ عام</h1></header><main><div class="card no-print"><a class="btn" href="admin.html">العودة إلى الإدارة</a><h2>إعداد الكشف</h2><div class="grid"><label>الصف<select id="grade"><option value="">اختر الصف</option></select></label><label>الفصل<select id="section"><option value="">اختر الفصل</option></select></label><label>عنوان الكشف<input id="sheetTitle" value="كشف مفرغ عام"></label><label>عدد الأعمدة أمام الطلاب (1–20)<input id="columns" type="number" min="1" max="20" value="5"></label><label>صفوف إضافية فارغة (0–30)<input id="extraRows" type="number" min="0" max="30" value="0"></label><label>مقاس الطباعة<select id="orientation"><option value="landscape">A4 بالعرض</option><option value="portrait">A4 طولي</option></select></label></div><button id="make">إنشاء الكشف</button><button id="print" disabled>طباعة الكشف</button><div class="msg" id="msg">جارٍ تجهيز بيانات الإدارة...</div><div id="headerControls" class="hidden"><h3>أسماء الأعمدة (يمكن تغييرها)</h3><div id="columnNames" class="headers"></div><button id="updateHeadings">تحديث عناوين الأعمدة</button></div></div><section id="sheet" class="card hidden"><div id="meta" class="meta"></div><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section><div class="foot">تصميم محمد عامر أحمد</div></main><script>

firebase.initializeApp({apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd"});
const db=firebase.firestore(), el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let students=[],account="",ready=false;
const setMsg=v=>el("msg").textContent=v;
function choices(id,items,label){const old=el(id).value;el(id).replaceChildren(new Option(label,""));items.forEach(s=>el(id).add(new Option(s,s)));if(items.includes(old))el(id).value=old}
function sections(){const g=el("grade").value;choices("section",[...new Set(students.filter(s=>String(s.grade??"")===g).map(s=>String(s.section??"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar",{numeric:true})),"اختر الفصل")}
const templateKey=()=> "admin_general_blank_sheet_v1_"+account;
function save(){if(!account)return;try{localStorage.setItem(templateKey(),JSON.stringify({count:Number(el("columns").value),labels:[...el("columnNames").querySelectorAll("input")].map(x=>x.value),extraRows:Number(el("extraRows").value),title:el("sheetTitle").value,orientation:el("orientation").value}))}catch(e){}}
function inputs(){const n=Number(el("columns").value);if(!Number.isInteger(n)||n<1||n>20)return;const old=[...el("columnNames").querySelectorAll("input")].map(x=>x.value);el("columnNames").replaceChildren();for(let i=0;i<n;i++){const l=document.createElement("label");l.textContent="العمود "+(i+1);const input=document.createElement("input");input.value=old[i]??("الخانة "+(i+1));l.append(input);el("columnNames").append(l)}el("headerControls").classList.remove("hidden")}
function restore(){try{const x=JSON.parse(localStorage.getItem(templateKey())||"null");if(!x)return;if(Number.isInteger(x.count)&&x.count>=1&&x.count<=20)el("columns").value=x.count;if(Number.isInteger(x.extraRows)&&x.extraRows>=0&&x.extraRows<=30)el("extraRows").value=x.extraRows;if(typeof x.title==="string")el("sheetTitle").value=x.title;if(["landscape","portrait"].includes(x.orientation))el("orientation").value=x.orientation;inputs();[...el("columnNames").querySelectorAll("input")].forEach((v,i)=>{if(typeof x.labels?.[i]==="string")v.value=x.labels[i]})}catch(e){}}
function head(){const n=Number(el("columns").value),labels=[...el("columnNames").querySelectorAll("input")].map(x=>x.value.trim());el("thead").innerHTML="<tr><th class='serial'>م</th><th class='student-name'>اسم الطالب</th>"+Array.from({length:n},(_,i)=>"<th>"+esc(labels[i]||"الخانة "+(i+1))+"</th>").join("")+"</tr>"}
async function init(){try{const role=String(sessionStorage.getItem("currentUserRole")||localStorage.getItem("currentUserRole")||"").trim().toLowerCase();account=String(sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUser")||localStorage.getItem("currentUser")||"").trim().toLowerCase();if(!["admin","superadmin"].includes(role)||!account)throw Error("هذه الخدمة للإدارة فقط");const snap=await db.collection("students").get();students=snap.docs.map(d=>({...d.data(),code:d.data().code||d.id}));choices("grade",[...new Set(students.map(s=>String(s.grade??"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar",{numeric:true})),"اختر الصف");restore();ready=true;setMsg("اختر الصف والفصل والأعمدة ثم أنشئ الكشف العام.")}catch(e){setMsg("تعذر فتح الخدمة: "+e.message);el("make").disabled=true}}
function make(){
 if(!ready)return;
 const grade=el("grade").value,section=el("section").value,n=Number(el("columns").value),extra=Number(el("extraRows").value);
 if(!grade||!section)return setMsg("اختر الصف والفصل.");
 if(!Number.isInteger(n)||n<1||n>20)return setMsg("عدد الأعمدة يجب أن يكون من 1 إلى 20.");
 if(!Number.isInteger(extra)||extra<0||extra>30)return setMsg("عدد الصفوف الإضافية يجب أن يكون بين 0 و30.");
 const roster=students.filter(s=>String(s.grade??"")===grade&&String(s.section??"")===section).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));
 inputs();save();
 const named=roster.map((x,i)=>"<tr><td class='serial'>"+(i+1)+"</td><td class='name'>"+esc(x.name||"")+"</td>"+Array.from({length:n},()=>"<td>&nbsp;</td>").join("")+"</tr>");
 const blank=Array.from({length:extra},(_,i)=>"<tr><td class='serial'>"+(roster.length+i+1)+"</td><td class='name'>&nbsp;</td>"+Array.from({length:n},()=>"<td>&nbsp;</td>").join("")+"</tr>");
 el("tbody").innerHTML=[...named,...blank].join("")||'<tr><td colspan="'+(n+2)+'">لا يوجد طلاب</td></tr>';
 el("headerTitle").textContent=el("sheetTitle").value.trim()||"كشف مفرغ عام";
 el("meta").innerHTML="<span>الصف: <b>"+esc(grade)+"</b> | الفصل: <b>"+esc(section)+"</b></span><span>عدد الطلاب: "+roster.length+(extra?" | صفوف إضافية: "+extra:"")+"</span>";
 head();el("sheet").classList.remove("hidden");el("print").disabled=false;
 const count=roster.length+extra;
 document.documentElement.style.setProperty("--print-font",count>=25?"9px":"10px");
 document.documentElement.style.setProperty("--name-font",count>=25?"8.5px":"9.5px");
 document.documentElement.style.setProperty("--print-row-height",count>=25?"6mm":"7mm");
 setMsg("تم تجهيز "+roster.length+" اسم و"+extra+" صف إضافي. "+(count>30?"سيحتاج الكشف لأكثر من صفحة لأن الإجمالي يتجاوز 30 صفًا.":"يمكن طباعة الكشف في صفحة واحدة A4 حتى 30 صفًا."));
}

el("grade").addEventListener("change",sections);el("make").addEventListener("click",make);el("updateHeadings").addEventListener("click",()=>{save();if(!el("sheet").classList.contains("hidden"))head()});el("columns").addEventListener("change",()=>{inputs();save();if(!el("sheet").classList.contains("hidden"))make()});el("extraRows").addEventListener("change",()=>{save();if(!el("sheet").classList.contains("hidden"))make()});el("columnNames").addEventListener("input",()=>{save();if(!el("sheet").classList.contains("hidden"))head()});["sheetTitle","orientation"].forEach(id=>el(id).addEventListener("change",()=>{save();if(id==="sheetTitle")el("headerTitle").textContent=el("sheetTitle").value.trim()||"كشف مفرغ عام"}));el("print").addEventListener("click",()=>{const tag=document.getElementById("sheetPageRules")||document.createElement("style");tag.id="sheetPageRules";tag.textContent="@media print{@page{size:A4 "+(el("orientation").value==="portrait"?"portrait":"landscape")+";margin:5mm}}";document.head.appendChild(tag);window.print()});init();

</script>
