*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#173b39;font:14px Tahoma,Arial}button,input,select{font:inherit}button{border:0;cursor:pointer;border-radius:9px;padding:10px 15px;background:#087b71;color:#fff}button.alt{background:#e9f4f1;color:#126b62}button.danger{background:#fff0ee;color:#a64036}input,select{padding:10px;border:1px solid #d5e2e0;border-radius:9px;background:white;min-width:0;width:100%}input[type=checkbox]{width:18px;height:18px;min-width:18px;cursor:pointer;accent-color:#087b71}label{display:block;font-size:12px;color:#59736e;margin-bottom:5px}h1,h2,h3{margin-top:0}.shell{max-width:1450px;margin:auto;padding:23px}.top{background:linear-gradient(110deg,#064a45,#128579);color:white;padding:22px;border-radius:18px;display:flex;align-items:center;gap:16px}.logo{width:63px;height:63px;border-radius:50%;object-fit:contain;background:white;padding:4px}.top h1{font-size:25px;margin:0 0 7px}.top p{margin:0;color:#d0eee8}.back{margin-right:auto;background:#ffffff23;color:white;text-decoration:none;padding:10px;border-radius:8px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:19px 0}.nav button{background:#e3eeec;color:#26635d}.nav button.active{background:#087b71;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:#fff;padding:21px;border:1px solid #e1ebea;border-radius:16px;box-shadow:0 5px 24px #093c3608;margin-bottom:15px}.panel h3{font-size:17px}.formrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}.formrow.four{grid-template-columns:repeat(4,minmax(0,1fr))}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.note{padding:12px;background:#e9f6f1;color:#235c52;border-radius:10px;line-height:1.9;margin:12px 0}.warn{background:#fff3e1;color:#895b16}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.stat{background:white;padding:14px 20px;border-radius:12px;border:1px solid #deebe8}.stat b{display:block;font-size:24px;color:#08776f}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{border:1px solid #e3ebe9;padding:10px;text-align:right;vertical-align:top}th{background:#eaf4f1;white-space:nowrap}td button{padding:5px 8px;font-size:11px}.small{color:#78908b;font-size:12px}.pill{display:inline-block;background:#e6f5f0;border-radius:8px;padding:5px 9px}.error{background:#fff0ed;color:#ad4735}.footer{text-align:center;color:#718d86;padding:20px}.empty{padding:22px;text-align:center;color:#849b96;border:1px dashed #cbdcd6;border-radius:12px}.slot{background:#f1faf7;padding:5px;border-radius:6px}.slot b{display:block;font-size:11px}.slot small{display:block;font-size:10px}.subhead{margin:14px 0 8px}#message{position:fixed;bottom:20px;left:20px;background:#064a45;color:white;border-radius:8px;padding:13px;display:none;z-index:10}@media(max-width:850px){.grid{grid-template-columns:1fr}.formrow,.formrow.four{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.back{margin-right:0}}@media(max-width:500px){.formrow,.formrow.four{grid-template-columns:1fr}.shell{padding:10px}.top h1{font-size:20px}}

</style></head><body><div class="shell"><div class="top"><img class="logo" src="../alfalah-round-logo.png" alt="شعار مدارس الفلاح"><div><h1>الجدول المدرسي الذكي</h1><p>راصد · الابتدائي والمتوسط والثانوي · إنشاء وتعديل وطباعة</p></div><a class="back" href="../admin.html">↩ لوحة الإدارة</a></div><div class="nav" id="nav"></div><div class="stats" id="stats"></div><div id="view"></div><div class="footer">مدارس الفلاح الأهلية · تصميم محمد عامر أحمد</div></div><div id="message"></div>
<script>
const KEY='alfalah-smart-timetable-v1',DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'],STAGES=['ابتدائي','متوسط','ثانوي'];
const timeRows={ابتدائي:[['07:15','07:55'],['07:55','08:35'],['08:35','09:15'],['09:15','09:55'],['10:05','10:45'],['10:45','11:25'],['11:25','12:05'],['12:05','12:45']],متوسط:[['07:15','08:00'],['08:00','08:45'],['08:45','09:30'],['09:45','10:30'],['10:30','11:15'],['11:15','12:00'],['12:20','13:00']],ثانوي:[['07:15','08:00'],['08:00','08:45'],['08:45','09:30'],['09:45','10:30'],['10:30','11:15'],['11:15','12:00'],['12:20','13:00']]};
function initial(){return {teachers:[],classes:[],loads:[],placements:[],reservations:[],constraints:{teacher:{},subject:{}},times:JSON.parse(JSON.stringify(timeRows)),limits:{ابتدائي:[8,8,8,7,7],متوسط:[7,7,7,7,7],ثانوي:[7,7,7,7,7]}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}state.constraints ||= {teacher:{},subject:{}};
state.reservations ||= [];
state.constraints.teacher ||= {};
state.constraints.subject ||= {};
for(const teacher of state.teachers){
 if(/^جعفر(?:\s|$)/u.test(String(teacher.name||"").trim()) && !Number.isInteger(teacher.weeklyTarget)) teacher.weeklyTarget=24;
}
let tab='setup',filterMode='class',filterId='',stageGroup='primary',printMode='teacher',printTarget='',printAll=false;
function selectedGroup(stage){return stageGroup==='primary'?stage==='ابتدائي':stage==='متوسط'||stage==='ثانوي'}
function setStageGroup(group){if(!['primary','upper'].includes(group))return;stageGroup=group;filterId='';render()}
function stageGroupBar(){return '<section class="panel no-print"><h3>المجموعة الدراسية</h3><div class="actions"><button class="'+(stageGroup==='primary'?'':'alt')+'" onclick="setStageGroup(\'primary\')">الابتدائي</button><button class="'+(stageGroup==='upper'?'':'alt')+'" onclick="setStageGroup(\'upper\')">المتوسط والثانوي</button></div><p class="small">الجداول منفصلة في العرض والتوليد والطباعة؛ المعلم المشترك واحد، وتُحسب تعارضاته مع المجموعة الأخرى.</p></section>'}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const byId=(arr,i)=>arr.find(x=>x.id===i);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=(value,label)=>'<option value="'+esc(value)+'">'+esc(label)+'</option>';
const fld=(label,input)=>'<div><label>'+label+'</label>'+input+'</div>';
const panel=(title,body)=>'<section class="panel"><h3>'+title+'</h3>'+body+'</section>';
const table=(head,rows)=>'<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function toast(msg){const n=document.getElementById('message');n.textContent=msg;n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',3500)}
function save(){
 state.reservations ||= [];
 state.constraints ||= {teacher:{},subject:{}};
 state.constraints.teacher ||= {};
 state.constraints.subject ||= {};
 for(const teacher of state.teachers||[]){
  if(/^جعفر(?:\s|$)/u.test(String(teacher.name||"").trim()) && !Number.isInteger(teacher.weeklyTarget))teacher.weeklyTarget=24;
 }
 localStorage.setItem(KEY,JSON.stringify(state));render();
}
function stageTime(stage,p){return state.times[stage]?.[p-1]}
function minutes(t){const a=String(t||'').split(':').map(Number);return a[0]*60+a[1]}
function overlaps(a,b){return minutes(a[0])<minutes(b[1])&&minutes(b[0])<minutes(a[1])}
function maxPeriods(c,day){return state.limits[c.stage]?.[DAYS.indexOf(day)]||0}
function canPlace(load,day,period,placements=state.placements,ignoreId){
 const c=byId(state.classes,load.classId),tm=stageTime(c?.stage,period);
 if(!c||!tm||period>maxPeriods(c,day)||!overlaps(tm,tm))return false;
 if(!constraintAllows(load,day,period))return false;
 if((state.reservations||[]).some(r=>r.teacherId===load.teacherId&&r.day===day&&r.period===period))return false;
 return !placements.some(p=>{
  if(p.id===ignoreId||p.day!==day)return false;
  const other=byId(state.loads,p.loadId),oc=byId(state.classes,other?.classId);
  if(!other||!oc)return false;
  if(oc.id===c.id&&p.period===period)return true;
  return other.teacherId===load.teacherId&&overlaps(tm,stageTime(oc.stage,p.period));
 });
}
function constraintAllows(load,day,period){
 const allowed=state.constraints?.teacher?.[load.teacherId]?.allowedPeriods;
 if(Array.isArray(allowed) && !allowed.includes(period))return false;
 const rule=state.constraints?.subject?.[String(load.subject||"").trim()];
 if(rule?.blockedPeriods?.includes(period))return false;
 const cls=byId(state.classes,load.classId);
 if(rule?.blockedLast && cls && period===maxPeriods(cls,day))return false;
 return true;
}
function assignedCount(loadId,placements=state.placements){return placements.filter(x=>x.loadId===loadId).length}
function displayClass(c){return c.stage+' — '+c.name}
function displayTeacher(t){return t?.name||'—'}
function viewSetup(){
 let tform='<div class="formrow">'+fld('اسم المعلم','<input id="tname" placeholder="الاسم الكامل">')+fld('التخصص','<input id="tdept" placeholder="رياضيات">')+'<button onclick="addTeacher()">إضافة معلم</button></div>';
 let cform='<div class="formrow">'+fld('المرحلة','<select id="cstage">'+STAGES.filter(selectedGroup).map(x=>opt(x,x)).join('')+'</select>')+fld('الصف والفصل','<input id="cname" placeholder="مثل: 3أ أو 1م أ">')+'<button onclick="addClass()">إضافة فصل</button></div>';
 let lform='<div class="formrow four">'+fld('الفصل','<select id="lclass">'+state.classes.filter(x=>selectedGroup(x.stage)).map(x=>opt(x.id,displayClass(x))).join('')+'</select>')+fld('المادة','<input id="lsubject" placeholder="الرياضيات">')+fld('المعلم','<select id="lteacher">'+state.teachers.map(x=>opt(x.id,x.name)).join('')+'</select>')+fld('الحصص أسبوعيًا','<input id="lhours" type="number" min="1" max="40" value="4">')+'</div><div class="actions"><button onclick="addLoad()">إضافة تكليف للمادة</button></div>';
 let tlist=state.teachers.map(t=>[esc(t.name),esc(t.dept),'<button class="danger" onclick="removeTeacher(\''+t.id+'\')">حذف</button>']);
 let clist=state.classes.filter(c=>selectedGroup(c.stage)).map(c=>[esc(c.stage),esc(c.name),'<button class="danger" onclick="removeClass(\''+c.id+'\')">حذف</button>']);
 let llist=state.loads.filter(l=>selectedGroup(byId(state.classes,l.classId)?.stage)).map(l=>{let c=byId(state.classes,l.classId),t=byId(state.teachers,l.teacherId);return [esc(displayClass(c)),esc(l.subject),esc(displayTeacher(t)),l.hours,assignedCount(l.id),'<button class="danger" onclick="removeLoad(\''+l.id+'\')">حذف</button>']});
 return '<div class="note">ابدأ بإضافة المعلمين والفصول، ثم حدّد عدد حصص كل مادة والمعلم المسؤول عنها لكل فصل. المعلم المشترك يُسجّل مرة واحدة فقط وتُربط به تكليفات كل المراحل.</div><div class="grid">'+panel('١. المعلمون',tform+(tlist.length?table(['الاسم','التخصص',''],tlist):'<div class="empty">لا يوجد معلمون</div>'))+panel('٢. الفصول',cform+(clist.length?table(['المرحلة','الفصل',''],clist):'<div class="empty">لا توجد فصول</div>'))+panel('٣. أنصبة المواد',lform+(llist.length?table(['الفصل','المادة','المعلم','المطلوب','الموزع',''],llist):'<div class="empty">أضف تكليفات المواد أولًا</div>'))+'</div>';
}
function addTeacher(){let name=document.getElementById('tname').value.trim(),dept=document.getElementById('tdept').value.trim();if(!name)return toast('اكتب اسم المعلم');if(state.teachers.some(x=>x.name===name))return toast('المعلم موجود بالفعل، اربطه بتكليفات المراحل الأخرى');state.teachers.push({id:id(),name,dept});save()}
function addClass(){let stage=document.getElementById('cstage').value,name=document.getElementById('cname').value.trim();if(!name)return toast('اكتب اسم الفصل');if(state.classes.some(x=>x.stage===stage&&x.name===name))return toast('هذا الفصل موجود');state.classes.push({id:id(),stage,name});save()}
function addLoad(){let classId=document.getElementById('lclass').value,teacherId=document.getElementById('lteacher').value,subject=document.getElementById('lsubject').value.trim(),hours=Number(document.getElementById('lhours').value);if(!classId||!teacherId||!subject||!Number.isInteger(hours)||hours<1||hours>40)return toast('أكمل بيانات التكليف');state.loads.push({id:id(),classId,teacherId,subject,hours});save()}
function removeTeacher(i){if(state.loads.some(x=>x.teacherId===i))return toast('احذف تكليفات هذا المعلم أولًا');if(confirm('حذف المعلم؟')){state.teachers=state.teachers.filter(x=>x.id!==i);save()}}
function removeClass(i){if(state.loads.some(x=>x.classId===i))return toast('احذف تكليفات هذا الفصل أولًا');if(confirm('حذف الفصل؟')){state.classes=state.classes.filter(x=>x.id!==i);save()}}
function removeLoad(i){if(!confirm('حذف التكليف وحصصه الموزعة؟'))return;state.loads=state.loads.filter(x=>x.id!==i);state.placements=state.placements.filter(x=>x.loadId!==i);save()}
function viewTimes(){
 let rows=[];for(let stage of STAGES){for(let p=1;p<=state.times[stage].length;p++){let a=state.times[stage][p-1];rows.push([stage,p,'<input type="time" value="'+a[0]+'" onchange="changeTime(\''+stage+'\','+p+',0,this.value)">','<input type="time" value="'+a[1]+'" onchange="changeTime(\''+stage+'\','+p+',1,this.value)">'])}}
 let max=STAGES.map(stage=>'<div class="panel"><h3>'+stage+'</h3><div class="formrow">'+DAYS.map((d,i)=>fld(d,'<input type="number" min="1" max="8" value="'+state.limits[stage][i]+'" onchange="changeLimit(\''+stage+'\','+i+',this.value)">')).join('')+'</div></div>').join('');
 return '<div class="note warn">الوقت هنا مهم جدًا: التعارض بين معلم مشترك يُحسب على تداخل الدقائق الفعلية، حتى لو اختلف رقم الحصة. راجع مواعيد الفسح والحصص قبل التوليد.</div>'+panel('مواعيد الحصص لكل مرحلة',table(['المرحلة','الحصة','من','إلى'],rows)) +max;
}
function changeTime(stage,p,i,value){let copy=state.times[stage][p-1].slice();copy[i]=value;if(minutes(copy[0])>=minutes(copy[1]))return toast('وقت النهاية يجب أن يكون بعد البداية');state.times[stage][p-1]=copy;save()}
function changeLimit(stage,i,value){let n=Number(value);if(!Number.isInteger(n)||n<1||n>state.times[stage].length)return toast('عدد الحصص غير صالح');state.limits[stage][i]=n;save()}
function generate(){
 const groupLoads=state.loads.filter(l=>selectedGroup(byId(state.classes,l.classId)?.stage));
 if(!groupLoads.length)return toast('لا توجد تكليفات مواد لهذه المرحلة');
 if(!confirm('سيُعاد توليد حصص المجموعة المختارة فقط، مع الحفاظ على جدول المجموعة الأخرى. هل تريد المتابعة؟'))return;
 const existingOther=state.placements.filter(p=>!groupLoads.some(l=>l.id===p.loadId));
 const tasks=[];groupLoads.forEach(l=>{for(let i=0;i<l.hours;i++)tasks.push(l)});
 const demand={};tasks.forEach(l=>demand[l.teacherId]=(demand[l.teacherId]||0)+1);
 let best=[],bestScore=-Infinity;
 for(let attempt=0;attempt<130;attempt++){
  let placed=existingOther.slice(),sorted=tasks.slice().sort((a,b)=>(demand[b.teacherId]-demand[a.teacherId])||(Math.random()-.5));
  for(let l of sorted){
   let c=byId(state.classes,l.classId),options=[];
   for(let d of DAYS)for(let p=1;p<=maxPeriods(c,d);p++)if(canPlace(l,d,p,placed)){
    let dayLoad=placed.filter(x=>x.day===d&&byId(state.loads,x.loadId)?.classId===c.id).length;
    let subjectToday=placed.filter(x=>x.day===d&&x.loadId===l.id).length;
    let teacherDay=placed.filter(x=>x.day===d&&byId(state.loads,x.loadId)?.teacherId===l.teacherId).length;
    let score=subjectToday*25+dayLoad*3+teacherDay*2+Math.random()*6;
    options.push({day:d,period:p,score});
   }
   options.sort((a,b)=>a.score-b.score);
   if(options.length){let pick=options[Math.min(Math.floor(Math.random()*Math.min(3,options.length)),options.length-1)];placed.push({id:id(),loadId:l.id,day:pick.day,period:pick.period})}
  }
  let groupPlaced=placed.filter(p=>!existingOther.includes(p));
  let score=groupPlaced.length*1000-groupPlaced.reduce((acc,p)=>acc+p.period*.01,0);
  if(score>bestScore){bestScore=score;best=groupPlaced}
  if(best.length===tasks.length&&attempt>15)break;
 }
 state.placements=[...existingOther,...best];save();toast('تم توزيع '+best.length+' من '+tasks.length+' حصة للمجموعة المختارة، مع الحفاظ على باقي الجدول');
}

 const violations=constraintViolations();
 return panel('قيود المعلمين — إلزامية','<p class="small">العلامة ✔ تسمح بالحصة. للمشرف المتاح في الأولى فقط، اترك علامة الحصة ١ واحذف باقي العلامات. حدّد النصاب الحقيقي حتى لو الاستيراد ناقص.</p>'+(rows.length?table(head,rows):'<div class="empty">أضف المعلمين أولًا.</div>'))+
 panel('قيود المواد — إلزامية','<p class="small">العلامة ✔ تمنع المادة من الحصة. «منع الأخيرة» يعني آخر حصة متاحة في اليوم والمرحلة، سواء السابعة أو الثامنة.</p>'+(subjectRows.length?table(['المادة',...periods.map(p=>'منع '+p),'منع الأخيرة'],subjectRows):'<div class="empty">أضف تكليفات المواد أولًا.</div>'))+
 (violations?panel('تنبيه بشأن الجدول الحالي','<div class="note warn">'+violations+' حصة موزعة حاليًا تخالف القيود الجديدة. استخدم التوليد لإعادة توزيعها؛ لن يقبل النظام إسنادات جديدة تخالف القيود.</div>'):'');
}
function viewSettings(){return panel('نسخ احتياطي واسترجاع','<div class="actions"><button onclick="downloadJson()">تنزيل نسخة JSON</button><label class="pill" style="cursor:pointer">استعادة نسخة <input type="file" accept=".json" style="display:none" onchange="restoreJson(this.files[0])"></label></div><div class="note">هذه النسخة تحفظ على نفس المتصفح فقط. نزّل نسخة احتياطية قبل أي تغيير كبير.</div>')+panel('إعادة ضبط بيانات الجدول','<p class="small">مسح بيانات هذا النظام فقط؛ لن يمس بيانات نظام بديل أو راصد.</p><button class="danger" onclick="resetAll()">مسح بيانات الجدول الذكي</button>')}
function resetAll(){if(!confirm('سيتم مسح جميع بيانات الجدول الذكي من هذا المتصفح. هل أخذت نسخة احتياطية؟'))return;if(prompt('اكتب مسح الجدول للتأكيد')!=='مسح الجدول')return;state=initial();save()}
function showTab(v){tab=v;render()}
function render(){document.getElementById('nav').innerHTML=[['setup','🧑‍🏫 المعلمون والفصول'],['times','⏰ مواعيد الحصص'],['constraints','🔒 إدارة القيود'],['generate','✨ التوليد الذكي'],['timetable','📅 عرض الجدول'],['print','🖨️ مركز الطباعة'],['settings','⚙️ النسخ الاحتياطي']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="showTab(\''+x[0]+'\')">'+x[1]+'</button>').join('');document.getElementById('stats').innerHTML=[['المعلمون',state.teachers.length],['الفصول',state.classes.length],['التكليفات',state.loads.length],['الحصص الموزعة',state.placements.length]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.getElementById('view').innerHTML=stageGroupBar()+({setup:viewSetup,times:viewTimes,generate:viewGenerate,timetable:viewTimetable,print:viewPrintCenter,constraints:viewConstraints,settings:viewSettings})[tab]()}
render();
</script><script>
(function(){
const BACKUP_KEY='alfalah-smart-timetable-backups-v1';
const REQUIRED=['المعلم','القسم','اليوم','الحصة','الصف','المادة'];
function getBackups(){
 try{let v=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');return Array.isArray(v)?v:[]}
 catch{return []}
}
function storeBackups(v){localStorage.setItem(BACKUP_KEY,JSON.stringify(v))}
function snapshot(){
 let b={id:id(),at:new Date().toISOString(),data:JSON.parse(JSON.stringify(state))};
 storeBackups([b,...getBackups()]);return b;
}
function protectCurrent(){
 const b=snapshot();
 dl('smart-timetable-backup-'+b.at.slice(0,10)+'.json',JSON.stringify(b.data,null,2),'application/json');
}
function parseBadeelCSV(text){
 let input=String(text||'').replace(/^\ufeff/,''),rows=[],row=[],cell='',quoted=false;
 for(let i=0;i<input.length;i++){
  const ch=input[i];
  if(quoted){
   if(ch==='"'&&input[i+1]==='"'){cell+='"';i++}
   else if(ch==='"')quoted=false;
   else cell+=ch;
  }else{
   if(ch==='"'&&cell==='')quoted=true;
   else if(ch===','){row.push(cell);cell=''}
   else if(ch==='\n'||ch==='\r'){
    if(ch==='\r'&&input[i+1]==='\n')i++;
    row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';
   }else cell+=ch;
  }
 }
 if(quoted)throw Error('علامات اقتباس غير مكتملة');
 row.push(cell);if(row.some(x=>x.trim()))rows.push(row);
 if(!rows.length)throw Error('الملف فارغ');
 let header=rows.shift().map(x=>x.trim());
 if(!REQUIRED.every(x=>header.includes(x)))throw Error('الأعمدة المطلوبة: '+REQUIRED.join('، '));
 return rows.map(c=>Object.fromEntries(header.map((h,i)=>[h,(c[i]||'').trim()])));
}
function inferStage(row){
 const group=String(row['القسم']||'').trim();
 const rawRoom=String(row['الصف']||'').replace(/\s+/g,' ').trim();
 const marked=rawRoom.match(/^(ابتدائي|متوسط|ثانوي)\s*[—–-]\s*(.+)$/);
 if(marked)return {stage:marked[1],room:marked[2]};
 // Badيل exports some shared teachers' class names with descriptive suffixes.
 // Strip only known annotations; never guess a class for generic duties.
 const room=rawRoom
  .replace(/\s*\+\s*تكليف خارج المتوسط والثانوي$/,'')
  .replace(/^متوسط\s*\+\s*/,'')
  .trim();
 if(/^[123]م\s*[أبج]$/.test(room))return {stage:'متوسط',room};
 if(/^[1-6][أبج]$/.test(room)){
  if(group==='متوسط وثانوي'&&/^[123][أبج]$/.test(room))return {stage:'ثانوي',room};
  return {stage:'ابتدائي',room};
 }
 return null;
}
function buildImport(rows){
 const base=initial(),issues=[],teacherMap=new Map(),classMap=new Map(),loadMap=new Map(),seen=new Set(),pending=[];
 for(let i=0;i<rows.length;i++){
  const row=rows[i],name=(row['المعلم']||'').trim(),day=row['اليوم'],p=Number(row['الحصة']);
  if(!name){issues.push('صف '+(i+2)+': اسم المعلم فارغ');continue}
  if(!teacherMap.has(name)){const t={id:id(),name,dept:row['القسم']||'',...(/^جعفر(?:\s|$)/u.test(name)?{weeklyTarget:24}:{})};base.teachers.push(t);teacherMap.set(name,t)}
  const isBus=/^ح(?:\s*\(|$)/u.test(String(row['الصف']||'').trim());
  if(isBus&&DAYS.includes(day)&&Number.isInteger(p)&&p>=1&&p<=8){
   const teacher=teacherMap.get(name);
   if(!base.reservations.some(r=>r.teacherId===teacher.id&&r.day===day&&r.period===p))base.reservations.push({id:id(),teacherId:teacher.id,day,period:p,kind:'bus'});
   continue;
  }
  const info=inferStage(row);
  if(!info||!DAYS.includes(day)||!Number.isInteger(p)||p<1||p>8){
   issues.push('صف '+(i+2)+': فصل/مرحلة/حصة تحتاج مراجعة للمعلم '+name);continue;
  }
  const k=info.stage+'|'+info.room;
  if(!classMap.has(k)){const c={id:id(),stage:info.stage,name:info.room};base.classes.push(c);classMap.set(k,c)}
  const teacher=teacherMap.get(name),cls=classMap.get(k),subject=row['المادة']||'غير محدد';
  const key=teacher.id+'|'+cls.id+'|'+subject,dupe=key+'|'+day+'|'+p;
  if(seen.has(dupe)){issues.push('صف '+(i+2)+': حصة مكررة');continue}
  seen.add(dupe);
  let load=loadMap.get(key);if(!load){load={id:id(),teacherId:teacher.id,classId:cls.id,subject,hours:0};base.loads.push(load);loadMap.set(key,load)}
  load.hours++;pending.push({load,day,period:p,line:i+2});
 }
 // Reservations are validated against *real period times*, including shared teachers.
 // Rows that conflict remain in the subject quota, but not as an invalid placement.
 for(let item of pending){
  let load=item.load,c=base.classes.find(x=>x.id===load.classId),tm=base.times[c.stage]?.[item.period-1];
  if(!tm||item.period>(base.limits[c.stage]?.[DAYS.indexOf(item.day)]||0)){
   issues.push('صف '+item.line+': الحصة خارج عدد حصص اليوم');continue;
  }
  const busConflict=base.reservations.some(r=>r.teacherId===load.teacherId&&r.day===item.day&&r.period===item.period);
  const conflict=busConflict||base.placements.some(p=>{
   if(p.day!==item.day)return false;
   const other=base.loads.find(l=>l.id===p.loadId),oc=base.classes.find(x=>x.id===other.classId);
   const ot=base.times[oc.stage][p.period-1];
   return (oc.id===c.id&&p.period===item.period)||(other.teacherId===load.teacherId&&overlaps(tm,ot));
  });
  if(conflict){issues.push('صف '+item.line+': تعارض توقيت/فصل للمعلم '+base.teachers.find(t=>t.id===load.teacherId).name);continue}
  base.placements.push({id:id(),loadId:load.id,day:item.day,period:item.period});
 }
 base.lastImport={parserVersion:2,total:rows.length,accepted:base.placements.length,reserved:base.reservations.length,unplaced:rows.length-base.placements.length-base.reservations.length,issues:issues.slice(0,80),more:Math.max(0,issues.length-80)};
 return base;
}
async function importBadeelCSV(file){
 if(!file)return;
 try{
  const rows=parseBadeelCSV(await file.text()),data=buildImport(rows);
  const detail='تم قراءة '+rows.length+' صف، منها '+data.placements.length+' حصة قابلة للتوزيع و'+data.reservations.length+' حافلة، و'+data.lastImport.unplaced+' حصة تحتاج مراجعة. المعلمون: '+data.teachers.length+'.';
  if(!confirm(detail+'\nسيتم استبدال بيانات الجدول الذكي الحالية بعد إنشاء نسخة احتياطية. هل تستورد الملف للتجربة؟'))return;
  protectCurrent();state=data;tab='setup';save();toast('تم الاستيراد. راجع تقرير المراجعة قبل التوليد');
 }catch(e){toast('تعذر الاستيراد: '+(e?.message||'ملف غير صالح'))}
}
function reviewPanel(){
 const a=state.lastImport;
 if(!a)return '';
 const stale=!a.parserVersion||a.parserVersion<2;
 const renew='<div class="note warn">'+(stale?'<b>هذا تقرير قديم لم يُحدَّث عند إصلاح الاستيراد.</b> ':'')+
 'ارفع ملف بديل نفسه مجددًا للحصول على عدد الملاحظات بعد معالجة الحافلات والتوصيفات. سيتم إنشاء نسخة احتياطية قبل استبدال الجدول، فلا تعِد الاستيراد إذا لديك تعديلات لم تحفظها.</div>'+
 '<div class="actions"><label class="tag" style="cursor:pointer">🔄 إعادة تحليل واستيراد ملف بديل CSV <input type="file" accept=".csv,text/csv" style="display:none" onchange="importBadeelCSV(this.files[0]);this.value=\'\'"></label></div>';
 const summary='<p><b>الصفوف:</b> '+a.total+' | <b>الموزعة:</b> '+a.accepted+' | <b>حافلات:</b> '+(a.reserved||0)+' | <b>غير محددة/معلّقة:</b> '+a.unplaced+'</p>';
 const notes=(a.issues?.length?'<details><summary>عرض الملاحظات ('+(a.issues.length+a.more)+')</summary><ul>'+a.issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>':'<div class="note">لم تُرصد ملاحظات.</div>');
 return panel('نتائج آخر استيراد من بديل',summary+renew+notes+'<div class="note warn">الرموز «حصة محجوزة» و«تكليف خارج المتوسط والثانوي» و«متوسط» لا تحدد فصلًا بعينه، لذلك تبقى للمراجعة ولا يُخترع لها فصل. الحرف «ح» يُفسَّر حافلة.</div>');
}
function deleteStoredBackup(bid){
 let all=getBackups();if(!all.some(x=>x.id===bid))return;
 if(prompt('لحذف هذه النسخة نهائيًا اكتب: حذف نهائي')!=='حذف نهائي')return;
 storeBackups(all.filter(x=>x.id!==bid));render();toast('تم حذف النسخة الاحتياطية نهائيًا');
}
function restoreStoredBackup(bid){
 const b=getBackups().find(x=>x.id===bid);
 if(!b||!Array.isArray(b.data?.teachers)||!Array.isArray(b.data?.loads))return toast('النسخة غير صالحة');
 if(!confirm('استعادة هذه النسخة ستستبدل بيانات الجدول الحالية. متابعة؟'))return;
 state=JSON.parse(JSON.stringify(b.data));save();toast('تمت استعادة النسخة');
}
const setup=viewSetup;
viewSetup=function(){
 return panel('استيراد تجريبي من نظام بديل','<p class="small">ارفع نفس ملف CSV الذي استخدمته في بديل، بالأعمدة: المعلم، القسم، اليوم، الحصة، الصف، المادة. سيتم إنشاء المعلمين والفصول والتكليفات تلقائيًا.</p><label class="pill" style="cursor:pointer">📥 استيراد CSV من بديل <input type="file" accept=".csv,text/csv" style="display:none" onchange="importBadeelCSV(this.files[0]);this.value=\'\'"></label><div class="note warn">الاستيراد لا يغيّر بيانات بديل، ويحتفظ بنسخة احتياطية من بيانات الجدول الذكي قبل الاستبدال.</div>')+reviewPanel()+setup();
};
const oldSettings=viewSettings;
viewSettings=function(){
 const records=getBackups().map(b=>'<div class="note"><b>نسخة بتاريخ '+esc(new Date(b.at).toLocaleString('ar-SA'))+'</b><div class="actions"><button class="alt" onclick="restoreStoredBackup(\''+b.id+'\')">استعادة</button><button class="danger" onclick="deleteStoredBackup(\''+b.id+'\')">حذف نهائي</button></div></div>').join('');
 return oldSettings()+panel('النسخ المحفوظة والحذف النهائي',records||'<p class="small">لا توجد نسخ محفوظة.</p>');
};
resetAll=function(){
 if(!confirm('سيتم مسح جميع المعلمين والفصول والحصص من الجدول الذكي، بعد إنشاء نسخة احتياطية. متابعة؟'))return;
 if(prompt('اكتب مسح الجدول للتأكيد')!=='مسح الجدول')return toast('تم إلغاء المسح');
 try{protectCurrent();state=initial();save();toast('تم المسح مع حفظ نسخة احتياطية')}catch{toast('فشل النسخ الاحتياطي، لم تُمسح البيانات')}
};
window.importBadeelCSV=importBadeelCSV;
window.deleteStoredBackup=deleteStoredBackup;
window.restoreStoredBackup=restoreStoredBackup;
})();
</script>
