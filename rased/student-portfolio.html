<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد | ملف إنجاز الطالب</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>body{font-family:Tahoma,Arial;background:#f3f7fa;color:#173a50;margin:0}header{background:linear-gradient(110deg,#073b68,#087461);color:white;padding:24px;text-align:center}header img{width:80px}main{max-width:1050px;margin:24px auto;padding:0 15px}.panel{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 3px 14px #1633}select,button{padding:11px;border:1px solid #cad9e1;border-radius:9px;font:inherit}button{background:#087461;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:11px;border-bottom:1px solid #dce7ee;text-align:right}h2{color:#075f77}footer{text-align:center;color:#62798a;padding:24px}@media print{header{background:white;color:#173a50}.controls,button{display:none!important}body{background:white}.panel{box-shadow:none;border:1px solid #ddd}}</style></head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1>ملف إنجاز الطالب الإلكتروني</h1><p>مدارس الفلاح الأهلية — نظام راصد</p></header><main><section class="panel controls"><label>اختر الطالب <select id="student"><option value="">جارٍ التحميل...</option></select></label> <button onclick="loadPortfolio()">عرض الملف</button> <button onclick="window.print()">طباعة</button> <a href="academic-development.html">العودة للوحدات الأكاديمية</a></section><div id="result" class="panel">اختر طالبًا لعرض ملفه.</div></main><footer>تصميم محمد عامر أحمد</footer><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let studentList=[];const el=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const role=localStorage.getItem("currentUserRole")||"";const username=String(localStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||"").toLowerCase();let assignments=[];
async function init(){if(!["admin","superadmin","manager","supervisor","teacher"].includes(role)){location.replace("index.html");return;}try{if(role==="teacher"){const t=await db.collection("teachers").doc(username).get();if(!t.exists)throw Error("لم يتم العثور على حساب المعلم");assignments=t.data().assignments||[];}const snap=await db.collection("students").get();studentList=snap.docs.map(d=>({code:String(d.data().code||d.id),...d.data()})).filter(s=>role!=="teacher"||assignments.some(a=>a.grade===s.grade&&a.section===s.section));studentList.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));el("student").innerHTML='<option value="">اختر الطالب</option>'+studentList.map(s=>'<option value="'+esc(s.code)+'">'+esc(s.name)+" — "+esc(s.grade)+" / "+esc(s.section)+'</option>').join("");}catch(e){el("result").textContent="تعذر تحميل الطلاب: "+e.message;}}
async function loadPortfolio(){const code=el("student").value;const st=studentList.find(s=>String(s.code)===code);if(!st){el("result").textContent="اختر طالبًا.";return;}el("result").textContent="جارٍ تحميل بيانات الطالب...";try{const [g,p]=await Promise.all([db.collection("grades").where("studentCode","==",code).get(),db.collection("academicRemedialPlans").where("studentCode","==",code).get()]);let grades=g.docs.map(d=>d.data()).filter(x=>role!=="teacher"||assignments.some(a=>a.grade===st.grade&&a.section===st.section&&a.subjectId===x.subjectId));let plans=p.docs.map(d=>d.data()).filter(x=>role!=="teacher"||assignments.some(a=>a.grade===st.grade&&a.section===st.section&&a.subjectId===x.subjectId));const rows=grades.map(x=>'<tr><td>'+esc(x.subjectName||"—")+'</td><td>'+esc(x.testName||"—")+'</td><td>'+esc(x.attendance==="absent"?"غائب":x.mark??"—")+'</td><td>'+esc(x.fullMark||"—")+'</td></tr>').join("");el("result").innerHTML='<h2>بيانات الطالب</h2><p><b>الاسم:</b> '+esc(st.name)+'</p><p><b>الصف والفصل:</b> '+esc(st.grade)+' / '+esc(st.section)+'</p><h2>السجل الأكاديمي</h2>'+(rows?'<table><thead><tr><th>المادة</th><th>الاختبار</th><th>الدرجة</th><th>النهاية العظمى</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p>لا توجد نتائج متاحة.</p>')+'<h2>الخطط العلاجية</h2>'+(plans.length?plans.map(x=>'<div class="panel"><b>'+esc(x.skill)+'</b><p>'+esc(x.action)+'</p><small>موعد المتابعة: '+esc(x.followupDate)+'</small></div>').join(""):'<p>لا توجد خطط علاجية مسجلة.</p>')+'<p style="color:#697c89;font-size:12px">هذه النسخة تعرض الدرجات والخطط المسجلة حاليًا. الإنجازات والمرفقات ستضاف في مرحلة لاحقة.</p>';}catch(e){el("result").textContent="تعذر عرض الملف: "+e.message;}}
init();</script></body></html>
