dow:0 3px 10px #0c426010}.portfolio-card h2{margin:0 0 15px}.remedial-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.remedial-tile{background:#f7fafc;border-right:4px solid #c68a2c;border-radius:10px;padding:14px}.signatures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}.signatures>div{text-align:center;border-top:2px solid #c68a2c;padding:12px 5px}.signatures small{display:block;color:#617789}.signatures strong{display:block;margin-top:8px;font-size:13px}@media(max-width:650px){.signatures{grid-template-columns:repeat(2,1fr)}}@media print{.portfolio-card{box-shadow:none;break-inside:avoid}.signatures{grid-template-columns:repeat(4,1fr)}} .print-only{display:none}@page{size:A4 portrait;margin:9mm}@media print{html,body{width:100%;margin:0!important;padding:0!important;font-size:11px!important}header{padding:5px!important;display:flex;justify-content:center;align-items:center;gap:12px}header img{width:40px!important}header h1{font-size:17px!important;margin:0}header p{font-size:11px!important;margin:0}main{margin:4px auto!important;padding:0!important;max-width:none!important}.panel{padding:6px!important;margin:5px 0!important;border:0!important}.student-head{padding:7px!important;margin:0!important}.student-head h2{font-size:12px!important;margin:0!important}.student-head p{margin:2px!important}.stats{grid-template-columns:repeat(3,1fr)!important;gap:5px!important;margin:5px 0!important}.stat{padding:5px!important}.stat strong{font-size:16px!important}.stat span{font-size:11px!important}.portfolio-card{padding:7px!important;margin:5px 0!important;break-inside:avoid}.portfolio-card h2{font-size:14px!important;margin:0 0 4px!important}table{font-size:11px!important}td,th{padding:4px 6px!important}.remedial-tile{padding:5px!important;margin:2px!important}.remedial-tile p{margin:2px 0!important}.print-extra,.screen-note{display:none!important}.print-only{display:block!important;font-size:8px!important;margin:3px!important}.signatures{grid-template-columns:repeat(2,1fr)!important;gap:5px!important;margin-top:10px!important;break-inside:avoid}.signatures>div{padding:5px 2px!important}.signatures strong{font-size:9px!important;margin-top:4px!important}.signatures small{font-size:9px!important}footer{padding:4px!important;font-size:9px!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}} .page-back{position:absolute;top:14px;right:16px;display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:10px;background:#ffffff;color:#075447!important;font-weight:700;text-decoration:none;box-shadow:0 2px 10px #0012;z-index:2}.page-back:hover{background:#e5f5ee}@media print{.page-back{display:none!important}}@media(max-width:600px){.page-back{position:static;margin-bottom:12px}}</style>
<link rel="stylesheet" href="rased-theme.css">
</head><body><header style="position:relative"><a class="page-back" href="academic-development.html">↩ العودة للتطوير الأكاديمي</a><img src="logo.jpeg" alt="شعار المدرسة"><h1>ملف إنجاز الطالب الإلكتروني</h1><p>مدارس الفلاح الأهلية — نظام راصد</p></header><main><section class="panel controls"><label>الصف <select id="grade" onchange="chooseGrade()"><option value="">اختر الصف</option></select></label> <label>الفصل <select id="section" onchange="chooseSection()"><option value="">اختر الفصل</option></select></label> <label>الطالب <select id="student"><option value="">اختر الطالب</option></select></label> <button onclick="loadPortfolio()">عرض الملف</button> <button onclick="window.print()">طباعة</button> <a href="academic-development.html">العودة للوحدات الأكاديمية</a></section><div id="result" class="panel">اختر طالبًا لعرض ملفه.</div></main><footer>تصميم محمد عامر أحمد</footer><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let studentList=[];const el=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const role=localStorage.getItem("currentUserRole")||"";const username=String(localStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||"").toLowerCase();let assignments=[];
function options(values,placeholder){return '<option value="">'+placeholder+'</option>'+values.sort((a,b)=>a.localeCompare(b,"ar",{numeric:true})).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");}
function chooseGrade(){el("section").innerHTML=options([...new Set(studentList.filter(s=>String(s.grade)===el("grade").value).map(s=>String(s.section||"")))].filter(Boolean),"اختر الفصل");el("student").innerHTML=options([],"اختر الطالب");el("result").textContent="اختر الفصل ثم الطالب.";}
function chooseSection(){const filtered=studentList.filter(s=>String(s.grade)===el("grade").value&&String(s.section)===el("section").value);el("student").innerHTML='<option value="">اختر الطالب</option>'+filtered.map(s=>'<option value="'+esc(s.code)+'">'+esc(s.name)+'</option>').join("");el("result").textContent="اختر الطالب لعرض ملفه.";}
function staffFooter(){return '<section class="signatures"><div><small>المشرف العام</small><strong>أحمد سمير عباس</strong></div><div><small>مدير المدرسة</small><strong>عبد العزيز بن إبراهيم القحطاني</strong></div></section>';}
async function init(){if(!["admin","superadmin","manager","supervisor","teacher"].includes(role)){location.replace("index.html");return;}try{if(role==="teacher"){const t=await db.collection("teachers").doc(username).get();if(!t.exists)throw Error("لم يتم العثور على حساب المعلم");assignments=t.data().assignments||[];}const snap=await db.collection("students").get();studentList=snap.docs.map(d=>({code:String(d.data().code||d.id),...d.data()})).filter(s=>role!=="teacher"||assignments.some(a=>a.grade===s.grade&&a.section===s.section));studentList.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));el("grade").innerHTML=options([...new Set(studentList.map(s=>String(s.grade||"")))].filter(Boolean),"اختر الصف");el("student").innerHTML='<option value="">اختر الطالب</option>'+studentList.map(s=>'<option value="'+esc(s.code)+'">'+esc(s.name)+" — "+esc(s.grade)+" / "+esc(s.section)+'</option>').join("");}catch(e){el("result").textContent="تعذر تحميل الطلاب: "+e.message;}}
async function loadPortfolio(){const code=el("student").value;const st=studentList.find(s=>String(s.code)===code);if(!st){el("result").textContent="اختر طالبًا.";return;}el("result").textContent="جارٍ تحميل بيانات الطالب...";try{const [g,p]=await Promise.all([db.collection("grades").where("studentCode","==",code).get(),db.collection("academicRemedialPlans").where("studentCode","==",code).get()]);let grades=g.docs.map(d=>d.data()).filter(x=>role!=="teacher"||assignments.some(a=>a.grade===st.grade&&a.section===st.section&&a.subjectId===x.subjectId));let plans=p.docs.map(d=>d.data()).filter(x=>role!=="teacher"||assignments.some(a=>a.grade===st.grade&&a.section===st.section&&a.subjectId===x.subjectId));const rows=grades.map((x,i)=>'<tr'+(i>=9?' class="print-extra"':'')+'><td>'+esc(x.subjectName||"—")+'</td><td>'+esc(x.testName||"—")+'</td><td>'+esc(x.attendance==="absent"?"غائب":x.mark??"—")+'</td><td>'+esc(x.fullMark||"—")+'</td></tr>').join("");const signatures=staffFooter();el("result").innerHTML='<div class="student-head"><h2>👨‍🎓 بطاقة الطالب</h2><p><b>الاسم:</b> '+esc(st.name)+'</p><p><b>الصف والفصل:</b> '+esc(st.grade)+' / '+esc(st.section)+'</p></div><div class="stats"><div class="stat"><strong>'+grades.length+'</strong><span>نتائج الاختبارات</span></div><div class="stat"><strong>'+plans.length+'</strong><span>الخطط العلاجية</span></div><div class="stat"><strong>'+new Set(grades.map(x=>x.subjectId||x.subjectName)).size+'</strong><span>المواد الدراسية</span></div></div><div class="portfolio-card"><h2>📊 السجل الأكاديمي</h2>'+(rows?'<table><thead><tr><th>المادة</th><th>الاختبار</th><th>الدرجة</th><th>النهاية العظمى</th></tr></thead><tbody>'+rows+'</tbody></table>'+(grades.length>9?'<p class="print-only">تُعرض أول ٩ نتائج من إجمالي '+grades.length+' نتيجة في النسخة المختصرة.</p>':''):'<p>لا توجد نتائج متاحة.</p>')+'</div><div class="portfolio-card"><h2>🎯 الخطط العلاجية</h2>'+(plans.length?plans.map((x,i)=>'<div class="remedial-tile'+(i>=2?' print-extra':'')+'"><b>'+esc(x.skill)+'</b><p>'+esc(x.action)+'</p><small>موعد المتابعة: '+esc(x.followupDate)+'</small></div>').join("")+(plans.length>2?'<p class="print-only">تُعرض أول خطتين من إجمالي '+plans.length+' خطط.</p>':''):'<p>لا توجد خطط علاجية مسجلة.</p>') +'</div>'+signatures+'<p class="screen-note" style="color:#697c89;font-size:12px">هذه النسخة تعرض الدرجات والخطط المسجلة حاليًا. الإنجازات والمرفقات ستضاف في مرحلة لاحقة.</p>';}catch(e){el("result").textContent="تعذر عرض الملف: "+e.message;}}
init();</script>
