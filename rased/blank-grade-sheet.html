<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشف درجات فارغ مرن | راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f2f7f4;color:#16463a;margin:0}header{background:#075540;color:white;text-align:center;padding:14px}header img{height:60px;width:60px;object-fit:contain;background:white;border-radius:9px}h1{font-size:22px;margin:6px}main{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:white;border:1px solid #d4e3db;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:bold}input,select{width:100%;padding:9px;margin:7px 0;border:1px solid #b7cfc2;border-radius:7px;font:14px Tahoma}button,.btn{background:#087356;color:white;border:0;border-radius:8px;padding:11px 15px;font:700 13px Tahoma;cursor:pointer;display:inline-block;margin:8px 3px;text-decoration:none}.msg{background:#e8f4ee;padding:10px;border-radius:8px;margin:10px 0}.hidden{display:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #80978b;text-align:center;padding:8px;font-size:13px}th{background:#e1ede6}td.name{text-align:right;font-weight:bold;width:34%}.dynamic-col{width:auto}.title{text-align:center;font-size:19px;margin:9px 0}.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;margin:10px 0}.foot{text-align:center;font-weight:bold;color:#688177;font-size:11px;margin:15px}.headers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.headers label{font-size:12px}@media(max-width:650px){.grid,.headers{grid-template-columns:1fr 1fr}}@media print{@page{size:A4 landscape;margin:7mm}body{background:white}header{padding:3px;background:white;color:#183c30;border-bottom:1px solid #a9c2b3}header img{width:42px;height:42px}header h1{font-size:17px;margin:4px}main{margin:2px auto;max-width:none;padding:0}.no-print{display:none!important}.card{border:0;padding:0;margin:0}.title{font-size:15px;margin:4px}.meta{font-size:11px;margin:5px}th,td{font-size:var(--print-font,11px);padding:var(--print-pad,4px) 3px;line-height:1.1;word-break:break-word}td.name{text-align:right}.foot{margin:7px;font-size:10px}tr{break-inside:avoid}thead{display:table-header-group}}</style></head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1 id="headerTitle">كشف متابعة الدرجات</h1></header><main><div class="card no-print"><a class="btn" href="teacher.html">العودة إلى المعلم</a><h2>إعداد الكشف</h2><div class="grid"><label id="teacherPickerBox" class="hidden">المعلم<select id="teacherPicker"><option value="">اختر المعلم</option></select></label><label>المادة<select id="subject"><option value="">اختر المادة</option></select></label><label>الصف<select id="grade"><option value="">اختر الصف</option></select></label><label>الفصل<select id="section"><option value="">اختر الفصل</option></select></label><label>عنوان الكشف<input id="sheetTitle" value="كشف متابعة الدرجات"></label><label>عدد الأعمدة أمام الطلاب (1–20)<input id="columns" type="number" min="1" max="20" value="5"></label><label>مقاس الطباعة<select id="orientation"><option value="landscape">A4 بالعرض</option><option value="portrait">A4 طولي</option></select></label></div><button id="make">إنشاء الكشف</button><button id="print" disabled>طباعة الكشف</button><div class="msg" id="msg">جارٍ التحقق من حساب المعلم...</div><div id="headerControls" class="hidden"><h3>أسماء الأعمدة (يمكن تغييرها)</h3><div id="columnNames" class="headers"></div><button id="updateHeadings">تحديث عناوين الأعمدة</button></div></div><section id="sheet" class="card hidden"><div id="meta" class="meta"></div><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section><div class="foot">تصميم محمد عامر أحمد</div></main><script>
firebase.initializeApp({apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd"});const db=firebase.firestore(),el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),norm=v=>String(v??"").trim().toLowerCase();let assignments=[],subjects=[],teacherName="",roster=[],teacherAccount="",supervisorTeachers=[];const setMsg=v=>el("msg").textContent=v;
function options(id,values,label){let v=el(id).value;el(id).replaceChildren(new Option(label,""));values.forEach(x=>el(id).add(new Option(x.text,x.value)));if(values.some(x=>x.value===v))el(id).value=v}
function updateFilters(){const subject=el("subject").value;const subjectList=[...new Map(assignments.map(a=>[String(a.subjectId),{value:String(a.subjectId),text:subjects.find(s=>s.id===String(a.subjectId))?.name||a.subjectName||String(a.subjectId)}])).values()];options("subject",subjectList,"اختر المادة");const a=assignments.filter(x=>String(x.subjectId)===el("subject").value);options("grade",[...new Set(a.map(x=>String(x.grade)))].map(x=>({value:x,text:x})),"اختر الصف");const g=el("grade").value;options("section",[...new Set(a.filter(x=>String(x.grade)===g).map(x=>String(x.section)))].map(x=>({value:x,text:x})),"اختر الفصل")}
async function selectTeacher(email){const snap=await db.collection("teachers").doc(email).get();if(!snap.exists)throw Error("بيانات المعلم غير موجودة");teacherName=snap.data().name||email;assignments=(snap.data().assignments||[]).filter(x=>x.grade&&x.section&&x.subjectId);updateFilters()}
async function init(){try{const role=norm(sessionStorage.getItem("currentUserRole")||localStorage.getItem("currentUserRole"));const account=norm(sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUser")||localStorage.getItem("currentUser"));if(!["teacher","supervisor"].includes(role)||!account)throw Error("الحساب غير مصرح له");teacherAccount=account;const sub=await db.collection("subjects").get();subjects=sub.docs.map(x=>({id:x.id,...x.data()}));if(role==="teacher"){await selectTeacher(account)}else{const user=await db.collection("users").doc(account).get();if(!user.exists||norm(user.data().role)!=="supervisor"||user.data().permissions?.blankGradeSheet!==true)throw Error("لم يمنحك الأدمن صلاحية إصدار الكشف المرن");const allowed=new Set((user.data().assignedTeacherEmails||[]).map(norm));const legacy=await db.collection("supervisors").doc(account).get();if(legacy.exists)(legacy.data().teachers||[]).forEach(x=>allowed.add(norm(x)));const all=await db.collection("teachers").get();supervisorTeachers=all.docs.filter(d=>allowed.has(norm(d.id))||allowed.has(norm(d.data().email))).map(d=>({id:d.id,name:d.data().name||d.id}));el("teacherPickerBox").classList.remove("hidden");el("teacherPicker").replaceChildren(new Option("اختر المعلم",""));supervisorTeachers.forEach(t=>el("teacherPicker").add(new Option(t.name,t.id)));el("teacherPicker").addEventListener("change",async()=>{const id=el("teacherPicker").value;if(!supervisorTeachers.some(t=>t.id===id)){assignments=[];updateFilters();return}await selectTeacher(id)});document.querySelector('a[href="teacher.html"]').href="supervisor-dashboard.html";}restoreColumnTemplate();setMsg("اختر المادة والصف والفصل وحدد الأعمدة ثم أنشئ الكشف.")}catch(e){setMsg("تعذر فتح الخدمة: "+e.message);el("make").disabled=true}}
function templateKey(){return "blank_grade_template_v1_"+teacherAccount}
function saveColumnTemplate(){if(!teacherAccount)return;try{localStorage.setItem(templateKey(),JSON.stringify({count:Number(el("columns").value),labels:[...el("columnNames").querySelectorAll("input")].map(x=>x.value),title:el("sheetTitle").value,orientation:el("orientation").value}))}catch(e){setMsg("تعذر حفظ عناوين الأعمدة محليًا")}}
function ensureColumnInputs(){const n=Number(el("columns").value);if(!Number.isInteger(n)||n<1||n>20)return;const old=[...el("columnNames").querySelectorAll("input")].map(x=>x.value);el("columnNames").replaceChildren();for(let i=0;i<n;i++){const label=document.createElement("label");label.textContent="العمود "+(i+1);const input=document.createElement("input");input.placeholder="الخانة "+(i+1);input.value=old[i]??("الخانة "+(i+1));label.append(input);el("columnNames").append(label)}el("headerControls").classList.remove("hidden")}
function restoreColumnTemplate(){try{const x=JSON.parse(localStorage.getItem(templateKey())||"null");if(!x)return;if(Number.isInteger(x.count)&&x.count>=1&&x.count<=20)el("columns").value=x.count;if(typeof x.title==="string"){el("sheetTitle").value=x.title;el("headerTitle").textContent=x.title||"كشف متابعة الدرجات";}if(["portrait","landscape"].includes(x.orientation))el("orientation").value=x.orientation;ensureColumnInputs();[...el("columnNames").querySelectorAll("input")].forEach((input,i)=>{if(typeof x.labels?.[i]==="string")input.value=x.labels[i]})}catch(e){}}
function buildHead(){const count=Number(el("columns").value),labels=[...el("columnNames").querySelectorAll("input")].map(x=>x.value.trim());el("thead").innerHTML="<tr><th style='width:5%'>م</th><th style='width:30%'>اسم الطالب</th>"+Array.from({length:count},(_,i)=>"<th>"+esc(labels[i]||"الخانة "+(i+1))+"</th>").join("")+"</tr>"}
async function make(){const subjectId=el("subject").value,g=el("grade").value,c=el("section").value,n=Number(el("columns").value);if(!subjectId||!g||!c||!assignments.some(x=>String(x.subjectId)===subjectId&&String(x.grade)===g&&String(x.section)===c))return setMsg("اختر مادة وصفًا وفصلًا من إسناداتك.");if(!Number.isInteger(n)||n<1||n>20)return setMsg("عدد الأعمدة يجب أن يكون من 1 إلى 20.");el("make").disabled=true;try{const snap=await db.collection("students").where("grade","==",g).get();roster=snap.docs.map(d=>({...d.data(),code:d.data().code||d.id})).filter(x=>String(x.section)===c).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));ensureColumnInputs();saveColumnTemplate();el("tbody").innerHTML=roster.map((x,i)=>"<tr><td>"+(i+1)+"</td><td class='name'>"+esc(x.name||"")+"</td>"+Array.from({length:n},()=>"<td>&nbsp;</td>").join("")+"</tr>").join("")||'<tr><td colspan="'+(n+2)+'">لا يوجد طلاب في هذا الفصل</td></tr>';el("headerTitle").textContent=el("sheetTitle").value.trim()||"كشف متابعة الدرجات";const subjectText=[...el("subject").options].find(x=>x.value===subjectId)?.text||"";el("meta").innerHTML="<span>المعلم: <b>"+esc(teacherName)+"</b></span><span>المادة: <b>"+esc(subjectText)+"</b></span><span>الصف: <b>"+esc(g)+"</b> | الفصل: <b>"+esc(c)+"</b></span><span>عدد الطلاب: "+roster.length+"</span>";buildHead();el("sheet").classList.remove("hidden");el("headerControls").classList.remove("hidden");el("print").disabled=false;const f=roster.length>38?9:roster.length>32?10:11,p=roster.length>38?2:roster.length>32?3:4;document.documentElement.style.setProperty("--print-font",f+"px");document.documentElement.style.setProperty("--print-pad",p+"px");setMsg("تم تجهيز الكشف الفارغ لعدد "+roster.length+" طالب، وعدد "+n+" أعمدة.")}catch(e){setMsg("تعذر تحميل الطلاب: "+e.message)}finally{el("make").disabled=false}}
el("subject").addEventListener("change",updateFilters);el("grade").addEventListener("change",updateFilters);el("make").addEventListener("click",make);el("updateHeadings").addEventListener("click",()=>{saveColumnTemplate();buildHead()});el("columns").addEventListener("change",()=>{ensureColumnInputs();saveColumnTemplate()});el("columnNames").addEventListener("input",()=>{saveColumnTemplate();if(!el("sheet").classList.contains("hidden"))buildHead()});["sheetTitle","orientation"].forEach(id=>el(id).addEventListener("change",()=>{saveColumnTemplate();if(id==="sheetTitle")el("headerTitle").textContent=el("sheetTitle").value||"كشف متابعة الدرجات"}));el("print").addEventListener("click",()=>{const tag=document.getElementById("sheetPageRules")||document.createElement("style");tag.id="sheetPageRules";tag.textContent='@media print{@page{size:A4 '+(el("orientation").value==="portrait"?"portrait":"landscape")+';margin:7mm}}';document.head.appendChild(tag);window.print()});init();
</script></body></html>
