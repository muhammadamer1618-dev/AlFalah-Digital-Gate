<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الطالب | راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173a30;font-family:Tahoma,Arial}header{background:#075441;color:white;text-align:center;padding:16px}header img{width:64px;height:64px;object-fit:contain;background:white;border-radius:12px}h1{font-size:23px;margin:8px}main{max-width:1150px;margin:18px auto;padding:0 14px}.card{background:white;border:1px solid #dae7df;border-radius:13px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-weight:bold;font-size:13px}select,input,textarea{display:block;width:100%;margin:7px 0;padding:10px;border:1px solid #bfcfc7;border-radius:8px;font:14px Tahoma}textarea{min-height:65px}.btn,button{border:0;border-radius:8px;background:#087858;color:white;font:bold 13px Tahoma;padding:11px 16px;cursor:pointer;margin:8px 4px}.msg{background:#e8f4ee;padding:11px;border-radius:8px;margin:10px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #d6e0da;padding:9px;text-align:right;font-size:13px}th{background:#edf5f0}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#edf5f0;border-radius:9px;padding:12px;font-weight:bold}.hidden{display:none}.foot{text-align:center;color:#71877a;font-size:11px;margin:17px}@media(max-width:680px){.grid{grid-template-columns:1fr}}@media print{.no-print{display:none!important}body{background:white}.card{border:0}.foot{margin-top:10px}}</style></head><body><header><img src="logo.jpeg" alt="شعار المدرسة"><h1>منظومة متابعة الطالب</h1><div>مدارس الفلاح الأهلية — راصد</div></header><main><a class="btn no-print" id="back" href="teacher.html">العودة</a><section class="card"><h2 id="heading">متابعة الطالب</h2><div class="msg" id="msg">جارٍ تحميل الصلاحيات والبيانات…</div><div class="grid"><label>الصف<select id="grade"><option value="">اختر الصف</option></select></label><label>الفصل<select id="section"><option value="">اختر الفصل</option></select></label><label>الطالب<select id="student"><option value="">جميع الطلاب</option></select></label></div></section><section class="card no-print hidden" id="editor"><h2>تسجيل ملاحظة جديدة</h2><div class="grid"><label>تصنيف الملاحظة<select id="kind"><option value="غير سلوكية">غير سلوكية</option><option value="سلوكية">سلوكية</option></select></label><label>نوع الملاحظة<select id="category"></select></label><label>التاريخ<input id="date" type="date"></label></div><label>تفاصيل إضافية (اختياري)<textarea id="details" placeholder="تفاصيل الموقف أو الإجراء المتخذ"></textarea></label><button id="save">تسجيل الملاحظة</button></section><section class="card"><h2>ملخص المتابعة والتكرار</h2><div id="stats" class="stats"></div><div class="scroll"><table><thead><tr><th>الطالب</th><th>نوع الملاحظة</th><th>التصنيف</th><th>مرات التكرار</th></tr></thead><tbody id="summary"></tbody></table></div></section><section class="card"><h2>سجل الملاحظات</h2><button class="no-print" onclick="window.print()">طباعة المتابعة</button><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الملاحظة</th><th>التصنيف</th><th>المعلم</th><th>التفاصيل</th></tr></thead><tbody id="history"></tbody></table></div></section><div class="foot">تصميم محمد عامر أحمد</div></main><script>
firebase.initializeApp({apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd"});const db=firebase.firestore(),el=id=>document.getElementById(id),norm=v=>String(v??"").trim().toLowerCase(),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cats={"غير سلوكية":["نسيان الكتاب","نسيان الدفتر","عدم حل الواجب","عدم إحضار الأدوات","التأخر في تسليم المهمة","عدم إكمال النشاط"],"سلوكية":["عدم التركيز","التحدث الجانبي","مقاطعة الشرح","كثرة الحركة","عدم الالتزام بالتعليمات","التأخر عن الحصة"]};let role="",account="",teacherName="",scope=[],students=[],records=[],subjectLookup={};function msg(t){el("msg").textContent=t}function fill(id,values,placeholder){const node=el(id),old=node.value;node.replaceChildren(new Option(placeholder,""));values.forEach(x=>node.add(new Option(x,x)));if(values.includes(old))node.value=old}function categories(){fill("category",cats[el("kind").value],"اختر نوع الملاحظة")}function scoped(g,s){return role!=="teacher"||scope.some(x=>String(x.grade)===g&&String(x.section)===s)}function refresh(){const grades=role==="teacher"?[...new Set(scope.map(x=>String(x.grade)))]:[...new Set(students.map(x=>String(x.grade)))];fill("grade",grades.sort((a,b)=>a.localeCompare(b,"ar",{numeric:true})),"كل الصفوف");const g=el("grade").value;const sections=role==="teacher"?[...new Set(scope.filter(x=>String(x.grade)===g).map(x=>String(x.section)))]:[...new Set(students.filter(x=>String(x.grade)===g).map(x=>String(x.section)))];fill("section",sections,"كل الفصول");const sec=el("section").value,arr=students.filter(x=>(!g||String(x.grade)===g)&&(!sec||String(x.section)===sec)&&scoped(String(x.grade),String(x.section)));let selected=el("student").value;el("student").replaceChildren(new Option(role==="teacher"?"اختر الطالب":"جميع الطلاب",""));arr.sort((a,b)=>String(a.name).localeCompare(String(b.name),"ar")).forEach(x=>el("student").add(new Option(x.name+" — "+x.code,x.code)));if(arr.some(x=>x.code===selected))el("student").value=selected;render()}function visible(x){const g=el("grade").value,s=el("section").value,code=el("student").value;return(!g||x.grade===g)&&(!s||x.section===s)&&(!code||x.studentCode===code)&&(role!=="teacher"||x.teacherEmail===account)}function render(){const data=records.filter(visible),agg=new Map();data.forEach(x=>{const k=x.studentCode+"|"+x.category;const v=agg.get(k)||{name:x.studentName,category:x.category,kind:x.kind,count:0};v.count++;agg.set(k,v)});const values=[...agg.values()].sort((a,b)=>b.count-a.count);el("stats").innerHTML='<div class="stat">إجمالي الملاحظات: '+data.length+'</div><div class="stat">الطلاب الذين لديهم ملاحظات: '+new Set(data.map(x=>x.studentCode)).size+'</div><div class="stat">أنواع الملاحظات المتكررة: '+values.filter(x=>x.count>1).length+'</div>';el("summary").innerHTML=values.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.kind)+'</td><td><b>'+x.count+'</b></td></tr>').join("")||'<tr><td colspan="4">لا توجد ملاحظات</td></tr>';el("history").innerHTML=data.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.studentName)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.teacherName)+'</td><td>'+esc(x.details||"—")+'</td></tr>').join("")||'<tr><td colspan="6">لا توجد ملاحظات</td></tr>'}
async function init(){try{role=norm(sessionStorage.getItem("currentUserRole")||localStorage.getItem("currentUserRole"));account=norm(sessionStorage.getItem("currentUserEmail")||localStorage.getItem("currentUserEmail")||sessionStorage.getItem("currentUser")||localStorage.getItem("currentUser"));if(!["teacher","supervisor","student_counselor"].includes(role)||!account)throw Error("الحساب غير مصرح له بالدخول");const u=await db.collection("users").doc(account).get();if(!u.exists||norm(u.data().role)!==role)throw Error("تعذر التحقق من الحساب");if(role==="supervisor"&&u.data().permissions?.studentFollowupView!==true)throw Error("لم يمنحك الأدمن صلاحية متابعة الطلاب");teacherName=u.data().name||account;if(role==="teacher"){const t=await db.collection("teachers").doc(account).get();if(!t.exists)throw Error("بيانات المعلم غير موجودة");scope=(t.data().assignments||[]).filter(x=>x.grade&&x.section);el("editor").classList.remove("hidden");el("heading").textContent="متابعة طلاب المعلم";el("back").href="teacher.html"}else if(role==="supervisor"){el("heading").textContent="ملخص متابعة الطلاب للمشرف";el("back").href="supervisor-dashboard.html"}else{el("heading").textContent="متابعة ملاحظات المعلمين — الموجه الطلابي";el("back").href="student-counselor.html"}const [ss,rs]=await Promise.all([db.collection("students").get(),db.collection("studentFollowupEvents").get()]);students=ss.docs.map(d=>({...d.data(),code:String(d.data().code||d.id)}));records=rs.docs.map(d=>({...d.data(),id:d.id})).filter(x=>role!=="teacher"||norm(x.teacherEmail)===account);categories();el("date").value=new Date().toLocaleDateString("en-CA");refresh();msg("يمكن مراجعة التكرار حسب الصف والفصل والطالب.")}catch(e){msg("تعذر تحميل المتابعة: "+e.message);el("editor").classList.add("hidden")}}
async function save(){const code=el("student").value,st=students.find(x=>x.code===code),g=el("grade").value,s=el("section").value,category=el("category").value;if(role!=="teacher"||!st||!category||!g||!s||!scoped(g,s)||st.grade!==g||st.section!==s)return msg("اختر الصف والفصل والطالب ونوع الملاحظة أولًا.");el("save").disabled=true;try{const data={studentCode:code,studentName:st.name,grade:g,section:s,kind:el("kind").value,category,date:el("date").value||new Date().toLocaleDateString("en-CA"),details:el("details").value.trim(),teacherEmail:account,teacherName,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const doc=await db.collection("studentFollowupEvents").add(data);records.push({...data,id:doc.id});el("details").value="";render();msg("تم تسجيل الملاحظة وتحديث تكرارها بنجاح.")}catch(e){msg("تعذر الحفظ: "+e.message)}finally{el("save").disabled=false}}
el("grade").addEventListener("change",refresh);el("section").addEventListener("change",refresh);el("student").addEventListener("change",render);el("kind").addEventListener("change",categories);el("save").addEventListener("click",save);init();
</script></body></html>
