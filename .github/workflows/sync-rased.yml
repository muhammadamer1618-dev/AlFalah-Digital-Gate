name: Sync Rased into AlFalah portal

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rased-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AlFalah portal
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout Rased source
        uses: actions/checkout@v4
        with:
          repository: muhammadamer1618-dev/rasededu
          ref: main
          path: _rased_source
          persist-credentials: false
      - name: Copy Rased files without removing portal-only files
        run: |
          # Executive dashboard is maintained in this portal; do not overwrite it from rasededu.
          mkdir -p rased
          rsync -a --exclude '.git' --exclude 'agent.html' --exclude 'rased-logout.js' --exclude 'rased-student-sso.js' --exclude 'exam-schedule.html' --exclude 'parent-guidance.html' --exclude 'parent-activities.html' --exclude 'exams.html' --exclude 'weekly.html' --exclude 'supervisor-guidance.html' --exclude 'student-counselor.html' --exclude 'activity-leader.html' --exclude 'CNAME' --exclude 'executive-dashboard.html' --exclude 'executive-viewer.js' --exclude 'rased-workspace.css' --exclude 'rased-workspace.js' --exclude 'rased-executive-workspace.css' --exclude 'rased-executive-workspace.js' --exclude 'change-password.html' --exclude 'sanad/' --exclude 'smart-timetable/' --exclude 'english-activities.html' --exclude 'admin-login.html' --exclude 'admin.html' --exclude 'teacher.html' --exclude 'supervisor.html' --exclude 'supervisor-dashboard.html' --exclude 'student.html' --exclude 'analysis.html' --exclude 'student-achievements.html' --exclude 'smart-certificates.html' --exclude 'top10.html' --exclude 'academic-development.html' --exclude 'teacher-performance.html' --exclude 'grade-sheet-print.html' --exclude 'student-followup.html' --exclude 'blank-grade-sheet.html' --exclude 'retest-notices.html' --exclude 'grade-improvement.html' --exclude 'supervisor-training.html' --exclude 'supervisor-weekly-report.html' --exclude 'teacher-training.html' --exclude 'bulk-whatsapp.html' --exclude 'staff-files.html' --exclude 'student-portfolio.html' --exclude 'remedial-plans.html' _rased_source/ rased/
          rm -rf _rased_source
      - name: Apply designer credit to synced and portal pages
        run: python3 scripts/apply-designer-credit.py
      - name: Commit and publish changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rased
          if git diff --cached --quiet; then
            echo "Rased already up to date"
          else
            git commit -m "Sync Rased latest updates into AlFalah portal"
            git push
          fi




