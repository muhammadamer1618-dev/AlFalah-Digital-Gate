<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
بوابة الفلاح الرقمية
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root{
  --green:#004c3f;
  --green2:#006653;
  --green3:#0b7864;
  --gold:#c9972c;
  --gold2:#f0cf79;
  --cream:#f7f1e4;
  --cream2:#fffdf8;
  --white:#ffffff;
  --text:#17372f;
  --muted:#6a776f;
  --danger:#b42318;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Tajawal",Tahoma,Arial,sans-serif;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
  linear-gradient(
    135deg,
    #f9f3e6 0%,
    #fffdf8 48%,
    #f5eddd 100%
  );
  color:var(--text);
}

button,
input{
  font-family:inherit;
}


/* =========================================
   MAIN PAGE
========================================= */

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px 28px 10px;
}


/* =========================================
   BACKGROUND DECORATION
========================================= */

.page::before{
  content:"";
  position:absolute;
  width:520px;
  height:300px;
  background:
  linear-gradient(
    140deg,
    var(--green),
    #003a30
  );
  top:-170px;
  right:-120px;
  border-radius:0 0 0 80%;
  transform:rotate(-8deg);
  box-shadow:0 14px 0 var(--gold);
  z-index:0;
}

.page::after{
  content:"";
  position:absolute;
  width:520px;
  height:300px;
  background:
  linear-gradient(
    140deg,
    #003a30,
    var(--green)
  );
  bottom:-190px;
  left:-120px;
  border-radius:0 80% 0 0;
  transform:rotate(8deg);
  box-shadow:0 -12px 0 var(--gold);
  z-index:0;
}


/* =========================================
   CORNER TEXT
========================================= */

.corner-left,
.corner-right{
  position:absolute;
  color:var(--gold2);
  font-weight:800;
  line-height:1.4;
  z-index:2;
  font-size:17px;
}

.corner-right{
  top:10px;
  right:34px;
  text-align:right;
}

.corner-left{
  bottom:30px;
  left:34px;
  text-align:left;
}

.corner-right::after,
.corner-left::after{
  content:"";
  display:block;
  width:54px;
  height:2px;
  background:var(--gold2);
  margin-top:8px;
}

.corner-left::after{
  margin-right:auto;
}


/* =========================================
   HEADER
========================================= */

.top{
  position:relative;
  z-index:3;
  text-align:center;
  flex:none;
}


/* =========================================
   LOGO
========================================= */

.logo{
  width:96px;
  height:96px;
  object-fit:contain;
  display:block;
  margin:0 auto 0;
  mix-blend-mode:multiply;
  filter:
  contrast(1.05)
  saturate(1.05)
  drop-shadow(
    0 4px 7px
    rgba(0,0,0,.05)
  );
}


/* =========================================
   TITLE
========================================= */

.main-title{
  color:var(--green);
  font-size:clamp(34px,4vw,58px);
  font-weight:900;
  line-height:1.02;
  margin-top:0;
  text-shadow:
  0 2px 0
  rgba(255,255,255,.8);
}


/* =========================================
   ENGLISH TITLE
========================================= */

.english-title{
  margin-top:3px;
  color:var(--gold);
  font-size:clamp(16px,1.4vw,24px);
  font-weight:800;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.english-title::before,
.english-title::after{
  content:"";
  width:70px;
  height:2px;
  background:
  linear-gradient(
    90deg,
    transparent,
    var(--gold)
  );
}

.english-title::after{
  background:
  linear-gradient(
    90deg,
    var(--gold),
    transparent
  );
}


/* =========================================
   PORTAL GRID
========================================= */

.portal-grid{
  position:relative;
  z-index:3;
  width:min(1120px,90vw);
  margin:7px auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  flex:1;
  align-items:center;
}


/* =========================================
   PORTAL CARD
========================================= */

.portal-card{
  position:relative;
  min-height:205px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  background:
  linear-gradient(
    145deg,
    #0c725f 0%,
    #005747 42%,
    #003f35 100%
  );
  box-shadow:
  0 0 0 3px rgba(214,170,65,.9),
  0 0 0 6px rgba(255,241,196,.8),
  0 16px 30px rgba(0,76,63,.20),
  inset 0 1px 0 rgba(255,255,255,.2);
  overflow:hidden;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:scale(1);
  transition:
  transform .28s cubic-bezier(.2,.8,.2,1),
  box-shadow .28s ease,
  filter .28s ease;
  will-change:transform;
}

.portal-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
  radial-gradient(
    circle at 50% 8%,
    rgba(255,255,255,.22),
    transparent 32%
  );
  pointer-events:none;
}

.portal-card::after{
  content:"";
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-55px;
  height:100px;
  border-radius:50%;
  background:rgba(255,255,255,.04);
  pointer-events:none;
}


/* =========================================
   CARD ZOOM
========================================= */

.portal-card:hover{
  transform:
  translateY(-7px)
  scale(1.065);
  z-index:20;
  filter:brightness(1.06);
  box-shadow:
  0 0 0 3px rgba(230,185,74,.98),
  0 0 0 7px rgba(255,243,204,.92),
  0 27px 48px rgba(0,64,53,.32);
}


/* =========================================
   CARD ICON
========================================= */

.card-icon{
  width:80px;
  height:80px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:34px;
  background:
  radial-gradient(
    circle,
    #063f36 15%,
    #012b25 100%
  );
  border:4px solid var(--gold);
  box-shadow:
  0 0 0 3px rgba(255,226,140,.30),
  0 0 17px rgba(231,189,81,.35),
  inset 0 0 15px rgba(0,0,0,.28);
  margin-bottom:14px;
  position:relative;
  z-index:2;
  transition:
  transform .28s cubic-bezier(.2,.8,.2,1),
  box-shadow .28s ease;
}

.portal-card:hover .card-icon{
  transform:scale(1.13);
  box-shadow:
  0 0 0 3px rgba(255,226,140,.40),
  0 0 27px rgba(231,189,81,.60),
  inset 0 0 15px rgba(0,0,0,.28);
}


/* =========================================
   CARD TITLE
========================================= */

.portal-card h2{
  position:relative;
  z-index:2;
  font-size:27px;
  font-weight:900;
  color:#fff;
  text-shadow:
  0 2px 5px
  rgba(0,0,0,.22);
  transition:transform .28s ease;
}

.portal-card:hover h2{
  transform:scale(1.05);
}

.portal-card h2::after{
  content:"";
  display:block;
  width:48px;
  height:3px;
  background:var(--gold);
  margin:10px auto 0;
  border-radius:4px;
  transition:width .28s ease;
}

.portal-card:hover h2::after{
  width:68px;
}


/* =========================================
   LEADERSHIP
========================================= */

.leadership{
  position:relative;
  z-index:3;
  width:min(780px,80vw);
  margin:0 auto 3px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  flex:none;
  transform:translateX(42px);
}

.leader{
  background:
  linear-gradient(
    180deg,
    rgba(255,255,255,.92),
    rgba(248,241,225,.92)
  );
  border:1px solid rgba(201,151,44,.42);
  border-radius:20px;
  padding:9px 20px;
  text-align:center;
  box-shadow:
  0 8px 22px
  rgba(82,63,24,.09);
  position:relative;
}

.leader::before{
  content:"";
  position:absolute;
  top:-2px;
  right:24%;
  left:24%;
  height:3px;
  background:
  linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

.leader-role{
  color:#ad7b15;
  font-weight:800;
  font-size:15px;
  margin-bottom:2px;
}

.leader-name{
  color:var(--green);
  font-weight:900;
  font-size:19px;
}


/* =========================================
   DESIGN CREDIT
========================================= */

.credit{
  position:relative;
  z-index:4;
  margin:5px auto 0;
  padding:6px 22px 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:18px;
  font-weight:900;
  color:#003f35;
  background:rgba(255,253,248,.78);
  border-radius:12px;
  flex:none;
}

.credit::before,
.credit::after{
  content:"";
  width:55px;
  height:2px;
  background:
  linear-gradient(
    90deg,
    transparent,
    var(--gold)
  );
}

.credit::after{
  background:
  linear-gradient(
    90deg,
    var(--gold),
    transparent
  );
}


/* =========================================
   MODAL
========================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,37,31,.76);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(650px,94vw);
  max-height:88vh;
  overflow:auto;
  background:
  linear-gradient(
    180deg,
    #fffefb,
    #f8f1e4
  );
  border-radius:26px;
  padding:22px;
  box-shadow:
  0 30px 80px
  rgba(0,0,0,.35);
  border:2px solid rgba(201,151,44,.42);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:14px;
  border-bottom:1px solid #eadfc8;
}

.modal-head h3{
  color:var(--green);
  font-size:25px;
  font-weight:900;
}

.close-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:#eee8da;
  color:#3e514b;
  font-size:22px;
  cursor:pointer;
}

.system-list{
  display:grid;
  gap:12px;
  margin-top:18px;
}

.system-link{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  text-decoration:none;
  color:inherit;
  border:1px solid #ded2bb;
  border-radius:16px;
  padding:15px 16px;
  background:#fff;
  cursor:pointer;
  transition:.2s ease;
}

.system-link:hover{
  border-color:var(--gold);
  background:#fffaf0;
  transform:translateX(-2px);
}

button.system-link{
  font:inherit;
  text-align:inherit;
}

.system-text{
  text-align:right;
}

.system-text strong{
  display:block;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.system-text span{
  display:block;
  color:var(--muted);
  margin-top:3px;
  font-size:13px;
}

.arrow{
  color:var(--gold);
  font-size:24px;
  font-weight:900;
}


/* =========================================
   PHONE LOOKUP
========================================= */

.phone-area{
  text-align:center;
  padding:8px 0 2px;
}

.phone-big-icon{
  width:76px;
  height:76px;
  margin:0 auto 12px;
  border-radius:50%;
  background:
  linear-gradient(
    145deg,
    var(--green2),
    var(--green)
  );
  display:grid;
  place-items:center;
  font-size:34px;
  border:4px solid var(--gold);
  box-shadow:
  0 8px 20px
  rgba(0,76,63,.18);
}

.phone-area h4{
  color:var(--green);
  font-size:21px;
  font-weight:900;
  margin-bottom:6px;
}

.phone-area p{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin-bottom:15px;
}

.phone-input{
  width:100%;
  height:52px;
  padding:0 14px;
  border:1px solid #d8cbb1;
  border-radius:14px;
  outline:none;
  font-size:18px;
  text-align:center;
  direction:ltr;
  background:#fff;
}

.phone-input:focus{
  border-color:var(--gold);
  box-shadow:
  0 0 0 3px
  rgba(201,151,44,.14);
}

.phone-btn{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  margin-top:12px;
  background:
  linear-gradient(
    145deg,
    var(--green2),
    var(--green)
  );
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.phone-btn:disabled{
  opacity:.6;
  cursor:wait;
}

.message{
  min-height:22px;
  margin-top:10px;
  font-size:14px;
  font-weight:800;
}

.back-btn{
  margin-top:4px;
  border:none;
  background:transparent;
  color:#68746e;
  font-weight:700;
  cursor:pointer;
  padding:6px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:1000px){

  html,
  body{
    overflow:auto;
  }

  .page{
    height:auto;
    min-height:100vh;
    overflow:visible;
    padding:15px 18px 22px;
  }

  .portal-grid{
    grid-template-columns:repeat(2,1fr);
    width:min(760px,92vw);
    flex:none;
    margin:18px auto;
  }

  .portal-card{
    min-height:190px;
  }

  .corner-left,
  .corner-right{
    display:none;
  }

  .leadership{
    width:min(760px,95vw);
    transform:none;
  }

}

@media(max-width:600px){

  .logo{
    width:82px;
    height:82px;
  }

  .main-title{
    font-size:34px;
  }

  .english-title{
    font-size:15px;
  }

  .portal-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .portal-card{
    min-height:165px;
    border-radius:21px;
  }

  .card-icon{
    width:66px;
    height:66px;
    font-size:28px;
    border-width:3px;
    margin-bottom:10px;
  }

  .portal-card h2{
    font-size:20px;
  }

  .portal-card:hover{
    transform:
    translateY(-4px)
    scale(1.035);
  }

  .portal-card:hover .card-icon{
    transform:scale(1.08);
  }

  .leadership{
    grid-template-columns:1fr;
    gap:10px;
  }

  .leader{
    padding:9px 12px;
  }

  .credit{
    font-size:15px;
  }

}

</style>

</head>

/* =========================================
   NORMALIZE PHONE
========================================= */

function normalizePhone(raw){

let phone =
String(
raw || ""
)
.trim()
.replace(/\s+/g,"")
.replace(/-/g,"")
.replace(/^\+/,"");


if(
phone.startsWith(
"00"
)
){

phone =
phone.slice(2);

}


if(
/^05\d{8}$/.test(
phone
)
){

phone =
"966" +
phone.slice(1);

}

else if(
/^5\d{8}$/.test(
phone
)
){

phone =
"966" +
phone;

}


return phone;

}


/* =========================================
   FIND TEACHER
========================================= */

async function findTeacher(){

const phoneInput =
document.getElementById(
"teacherPhone"
);


const message =
document.getElementById(
"phoneMessage"
);


const button =
document.getElementById(
"phoneLogin"
);


const phone =
normalizePhone(
phoneInput.value
);


message.textContent =
"";


if(
!/^9665\d{8}$/.test(
phone
)
){

message.style.color =
varDanger();


message.textContent =
"اكتب رقم جوال صحيح مثل 05xxxxxxxx";


return;

}


button.disabled =
true;


button.textContent =
"جاري التحقق...";


try{


const q =
query(

collection(
visitDb,
"teachers"
),

where(
"phone",
"==",
phone
),

limit(5)

);


const result =
await getDocs(q);


if(
result.empty
){

message.style.color =
varDanger();


message.textContent =
"رقم الجوال غير مسجل";


return;

}


let teacherDoc =
null;


result.forEach(

d => {

const data =
d.data();


if(
!teacherDoc &&
data.active === true
){

teacherDoc =
d;

}

}

);


if(
!teacherDoc
){

message.style.color =
varDanger();


message.textContent =
"الحساب غير مفعل";


return;

}


message.style.color =
"#006653";


message.textContent =
"تم التحقق ✓";


const url =

"https://muhammadamer1618-dev.github.io/visit/teacher-form.html?tid="

+

encodeURIComponent(
teacherDoc.id
);


setTimeout(

()=>{

window.location.href =
url;

},

350

);


}

catch(error){

console.error(
error
);


message.style.color =
varDanger();


message.textContent =
"تعذر التحقق من رقم الجوال حاليًا";

}

finally{

button.disabled =
false;


button.textContent =
"دخول";

}

}

}

}

);

</script>
