<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الخطة الأسبوعية | رائد الصف</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root{
    --green:#004c3f;
    --green-dark:#003b32;
    --green-light:#08705d;

    --gold:#c9972c;
    --gold-light:#f0cf78;

    --cream:#f8f2e7;
    --cream-light:#fffdf9;

    --white:#ffffff;

    --text:#17372f;
    --muted:#6d7974;

    --danger:#b42318;
    --success:#177245;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    font-family:
    "Tajawal",
    Tahoma,
    Arial,
    sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(
        circle at center,
        #fffdf9 0%,
        #f8f1e3 63%,
        #eee1c7 100%
    );

    color:var(--text);
}

button,
input{
    font-family:inherit;
}


/* ===============================
   FULL SCREEN PAGE
=============================== */

.page{
    position:relative;

    width:100vw;
    height:100dvh;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:space-between;

    padding:16px 28px 12px;
}


/* ===============================
   GREEN DECORATION
=============================== */

.page::before{
    content:"";

    position:absolute;

    width:620px;
    height:340px;

    top:-205px;
    right:-140px;

    background:
    linear-gradient(
        145deg,
        var(--green-light),
        var(--green-dark)
    );

    border-radius:0 0 0 88%;

    transform:rotate(-7deg);

    box-shadow:
    0 14px 0 var(--gold);

    z-index:0;
}


.page::after{
    content:"";

    position:absolute;

    width:620px;
    height:340px;

    bottom:-220px;
    left:-140px;

    background:
    linear-gradient(
        145deg,
        var(--green-dark),
        var(--green-light)
    );

    border-radius:0 88% 0 0;

    transform:rotate(7deg);

    box-shadow:
    0 -14px 0 var(--gold);

    z-index:0;
}


/* ===============================
   DECORATIVE WORDS
=============================== */

.corner-right,
.corner-left{
    position:absolute;

    z-index:2;

    color:var(--gold-light);

    font-size:17px;
    font-weight:800;

    line-height:1.55;
}

.corner-right{
    top:28px;
    right:36px;

    text-align:right;
}

.corner-left{
    bottom:30px;
    left:36px;

    text-align:left;
}

.corner-right::after,
.corner-left::after{
    content:"";

    display:block;

    width:54px;
    height:2px;

    margin-top:8px;

    background:var(--gold-light);
}

.corner-left::after{
    margin-right:auto;
}


/* ===============================
   HEADER
=============================== */

.header{
    position:relative;
    z-index:3;

    text-align:center;

    flex:none;
}

.logo{
    display:block;

    width:105px;
    height:105px;

    object-fit:contain;

    margin:0 auto 1px;

    filter:
    drop-shadow(
        0 5px 10px rgba(0,0,0,.10)
    );
}

.title{
    color:var(--green);

    font-size:
    clamp(
        34px,
        4vw,
        54px
    );

    font-weight:900;

    line-height:1.05;
}

.english-title{
    margin-top:5px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    color:var(--gold);

    font-size:
    clamp(
        15px,
        1.3vw,
        21px
    );

    font-weight:900;

    letter-spacing:.7px;
}

.english-title::before,
.english-title::after{
    content:"";

    width:64px;
    height:2px;
}

.english-title::before{
    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.english-title::after{
    background:
    linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}


/* ===============================
   LOGIN AREA
=============================== */

.login-area{
    position:relative;

    z-index:3;

    flex:1;

    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:10px 0;
}


/* ===============================
   LOGIN CARD
=============================== */

.login-card{
    position:relative;

    width:min(520px,92vw);

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.97),
        rgba(248,241,226,.97)
    );

    border:
    2px solid rgba(201,151,44,.50);

    border-radius:30px;

    padding:24px 30px 26px;

    box-shadow:
    0 0 0 5px rgba(255,243,206,.72),
    0 26px 55px rgba(0,76,63,.18);
}

.login-card::before{
    content:"";

    position:absolute;

    top:-3px;
    right:23%;
    left:23%;

    height:4px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}


/* ===============================
   TEACHER ICON
=============================== */

.teacher-icon{
    width:92px;
    height:92px;

    margin:0 auto 13px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #075243,
        #01362d
    );

    color:white;

    font-size:42px;

    border:
    5px solid var(--gold);

    box-shadow:
    0 0 0 4px rgba(255,222,131,.30),
    0 8px 24px rgba(0,76,63,.20);
}

.login-title{
    text-align:center;

    color:var(--green);

    font-size:25px;

    font-weight:900;
}

.login-subtitle{
    text-align:center;

    color:var(--muted);

    font-size:14px;

    line-height:1.7;

    margin:5px 0 20px;
}


/* ===============================
   FORM
=============================== */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:6px;

    color:var(--green);

    font-size:14px;

    font-weight:800;
}

.form-group input{
    width:100%;
    height:50px;

    border:
    1px solid #d7cbb4;

    border-radius:13px;

    outline:none;

    background:white;

    padding:0 14px;

    font-size:16px;

    transition:.2s ease;
}

.form-group input:focus{
    border-color:var(--gold);

    box-shadow:
    0 0 0 3px rgba(201,151,44,.14);
}

.login-btn{
    width:100%;
    height:51px;

    margin-top:2px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        145deg,
        var(--green-light),
        var(--green)
    );

    color:white;

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 9px 20px rgba(0,76,63,.18);

    transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.login-btn:hover{
    transform:translateY(-1px);

    box-shadow:
    0 12px 24px rgba(0,76,63,.24);
}

.login-btn:disabled{
    opacity:.6;

    cursor:wait;

    transform:none;
}


/* ===============================
   MESSAGE
=============================== */

.message{
    display:none;

    margin-top:13px;

    padding:10px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    font-weight:800;
}

.message.error{
    display:block;

    background:#fdebea;

    color:var(--danger);
}

.message.success{
    display:block;

    background:#e9f7ee;

    color:var(--success);
}


/* ===============================
   LEADERSHIP
=============================== */

.leadership{
    position:relative;

    z-index:3;

    width:min(790px,86vw);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;

    flex:none;

    margin-bottom:3px;
}

.leader{
    position:relative;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.95),
        rgba(247,239,221,.95)
    );

    border:
    1px solid rgba(201,151,44,.45);

    border-radius:18px;

    padding:9px 18px;

    text-align:center;

    box-shadow:
    0 7px 18px rgba(72,56,20,.08);
}

.leader::before{
    content:"";

    position:absolute;

    top:-2px;
    right:27%;
    left:27%;

    height:3px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

.leader-role{
    color:#ae7b14;

    font-size:14px;

    font-weight:900;
}

.leader-name{
    margin-top:1px;

    color:var(--green);

    font-size:18px;

    font-weight:900;
}


/* ===============================
   DESIGN CREDIT
=============================== */

.credit{
    position:relative;

    z-index:4;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    color:var(--green-dark);

    font-size:18px;

    font-weight:900;

    padding:5px 18px;

    background:
    rgba(255,253,249,.78);

    border-radius:12px;

    flex:none;
}

.credit::before,
.credit::after{
    content:"";

    width:58px;
    height:2px;
}

.credit::before{
    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.credit::after{
    background:
    linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}


/* ===============================
   MOBILE
=============================== */

@media(max-width:700px){

    .page{
        padding:10px 14px 8px;
    }

    .corner-right,
    .corner-left{
        display:none;
    }

    .logo{
        width:78px;
        height:78px;
    }

    .title{
        font-size:28px;
    }

    .english-title{
        font-size:13px;
        margin-top:3px;
    }

    .english-title::before,
    .english-title::after{
        width:35px;
    }

    .login-area{
        padding:6px 0;
    }

    .login-card{
        width:min(460px,92vw);

        padding:16px 18px 17px;

        border-radius:24px;
    }

    .teacher-icon{
        width:68px;
        height:68px;

        font-size:31px;

        border-width:4px;

        margin-bottom:8px;
    }

    .login-title{
        font-size:21px;
    }

    .login-subtitle{
        font-size:12px;

        margin:3px 0 11px;
    }

    .form-group{
        margin-bottom:10px;
    }

    .form-group label{
        margin-bottom:4px;

        font-size:12px;
    }

    .form-group input{
        height:43px;

        font-size:14px;
    }

    .login-btn{
        height:44px;

        font-size:15px;
    }

    .leadership{
        width:94%;

        grid-template-columns:1fr 1fr;

        gap:8px;
    }

    .leader{
        padding:6px 7px;
    }

    .leader-role{
        font-size:11px;
    }

    .leader-name{
        font-size:13px;
    }

    .credit{
        padding:3px 12px;

        font-size:13px;
    }

    .credit::before,
    .credit::after{
        width:30px;
    }

}


/* ===============================
   VERY SHORT SCREENS
=============================== */

@media(max-height:700px){

    .page{
        padding-top:7px;
        padding-bottom:5px;
    }

    .logo{
        width:72px;
        height:72px;
    }

    .title{
        font-size:28px;
    }

    .english-title{
        margin-top:2px;
        font-size:13px;
    }

    .login-area{
        padding:4px 0;
    }

    .login-card{
        padding:14px 22px;
    }

    .teacher-icon{
        width:62px;
        height:62px;

        font-size:28px;

        margin-bottom:6px;
    }

    .login-title{
        font-size:20px;
    }

    .login-subtitle{
        margin:2px 0 9px;

        font-size:12px;
    }

    .form-group{
        margin-bottom:8px;
    }

    .form-group input{
        height:40px;
    }

    .login-btn{
        height:42px;
    }

    .leader{
        padding:5px 10px;
    }

    .leader-role{
        font-size:11px;
    }

    .leader-name{
        font-size:13px;
    }

    .credit{
        font-size:13px;
        padding:2px 12px;
    }

}

</style>

</head>


<body>


<main class="page">


<div class="corner-right">

قيم<br>
معرفة<br>
مهارات<br>
مستقبل أفضل

</div>


<div class="corner-left">

بالعلم نصنع<br>
المستقبل

</div>



<!-- ===============================
     HEADER
=============================== -->

<header class="header">


<img
src="logo.jpeg"
class="logo"
alt="شعار مدارس الفلاح الأهلية"
>


<h1 class="title">

الخطة الأسبوعية

</h1>


<div class="english-title">

Weekly Plan

</div>


</header>



<!-- ===============================
     LOGIN AREA
=============================== -->

<section class="login-area">


<div class="login-card">


<div class="teacher-icon">

👨‍🏫

</div>


<div class="login-title">

دخول رائد الصف

</div>


<div class="login-subtitle">

إعداد وتحديث وحفظ الخطة الأسبوعية الخاصة بالفصل

</div>



<form id="loginForm">


<div class="form-group">

<label for="username">

اسم المستخدم

</label>


<input
type="text"
id="username"
placeholder="اسم المستخدم"
autocomplete="username"
required
>


</div>



<div class="form-group">


<label for="password">

كلمة المرور

</label>


<input
type="password"
id="password"
placeholder="كلمة المرور"
autocomplete="current-password"
required
>


</div>



<button
type="submit"
id="loginBtn"
class="login-btn"
>

دخول رائد الصف

</button>



<div
id="message"
class="message"
></div>


</form>


</div>


</section>



<!-- ===============================
     LEADERSHIP
=============================== -->

<section class="leadership">


<div class="leader">


<div class="leader-role">

المشرف العام

</div>


<div class="leader-name">

أحمد سمير

</div>


</div>



<div class="leader">


<div class="leader-role">

مدير المدرسة

</div>


<div class="leader-name">

عبد العزيز بن إبراهيم القحطاني

</div>


</div>


</section>



<!-- ===============================
     CREDIT
=============================== -->

<div class="credit">

تصميم محمد عامر أحمد

</div>


</main>



<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* ===============================
   FIREBASE
=============================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBYxW_pdFvE1VZyDoTok4-EutPe6oigJhY",

    authDomain:
    "weekly-plan-3a743.firebaseapp.com",

    projectId:
    "weekly-plan-3a743",

    storageBucket:
    "weekly-plan-3a743.firebasestorage.app",

    messagingSenderId:
    "575884603803",

    appId:
    "1:575884603803:web:e8c4d82c69fd545bed313e"

};



const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);



/* ===============================
   ELEMENTS
=============================== */

const loginForm =
document.getElementById(
    "loginForm"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


const message =
document.getElementById(
    "message"
);



/* ===============================
   MESSAGE
=============================== */

function showMessage(
    text,
    type
){

    message.textContent =
    text;


    message.className =
    "message " +
    type;

}



/* ===============================
   LOGIN
=============================== */

loginForm.addEventListener(
    "submit",
    async event=>{


        event.preventDefault();


        const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim()
        .toLowerCase();


        const password =
        document
        .getElementById(
            "password"
        )
        .value;


        if(
            !username ||
            !password
        ){

            showMessage(
                "أدخل اسم المستخدم وكلمة المرور",
                "error"
            );

            return;

        }



        /*
        منع دخول الأدمن من صفحة رائد الصف
        */

        if(
            username ===
            "admin"
        ){

            showMessage(
                "هذا الدخول مخصص لرائد الصف فقط",
                "error"
            );

            return;

        }



        loginBtn.disabled =
        true;


        loginBtn.textContent =
        "جاري تسجيل الدخول...";



        try{


            const email =
            username +
            "@weeklyplan.local";



            const credential =
            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );



            const uid =
            credential.user.uid;



            const userRef =
            doc(
                db,
                "users",
                uid
            );



            const userSnapshot =
            await getDoc(
                userRef
            );



            if(
                !userSnapshot.exists()
            ){

                await signOut(
                    auth
                );


                showMessage(
                    "الحساب غير مسجل داخل النظام",
                    "error"
                );


                return;

            }



            const userData =
            userSnapshot.data();



            if(
                userData.active ===
                false
            ){

                await signOut(
                    auth
                );


                showMessage(
                    "هذا الحساب غير مفعل",
                    "error"
                );


                return;

            }



            /*
            السماح لرائد الصف فقط
            */

            if(
                userData.role !==
                "classLeader"
            ){

                await signOut(
                    auth
                );


                showMessage(
                    "هذه الصفحة مخصصة لرائد الصف فقط",
                    "error"
                );


                return;

            }



            sessionStorage.setItem(
                "weeklyPlanUserName",
                userData.name || ""
            );


            sessionStorage.setItem(
                "weeklyPlanUserRole",
                userData.role || ""
            );


            sessionStorage.setItem(
                "weeklyPlanUserId",
                uid
            );



            showMessage(
                "تم تسجيل الدخول بنجاح",
                "success"
            );



            setTimeout(
                ()=>{

                    window.location.href =
                    "teacher.html";

                },
                350
            );


        }


        catch(error){


            console.error(
                error
            );


            let text =
            "اسم المستخدم أو كلمة المرور غير صحيحة";


            if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                "تم إجراء محاولات كثيرة، حاول بعد قليل";

            }


            if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                "تعذر الاتصال بالإنترنت";

            }


            showMessage(
                text,
                "error"
            );


        }


        finally{


            loginBtn.disabled =
            false;


            loginBtn.textContent =
            "دخول رائد الصف";


        }


    }
);


</script>


</body>

</html>
