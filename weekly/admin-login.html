<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الخطة الأسبوعية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root{
    --green:#004c3f;
    --green-dark:#003b32;
    --green-light:#08705d;

    --gold:#c9972c;
    --gold-light:#f0cf78;

    --cream:#f8f2e7;
    --cream-light:#fffdf9;

    --white:#ffffff;

    --text:#17372f;
    --muted:#6d7974;

    --danger:#b42318;
    --success:#177245;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    font-family:
    "Tajawal",
    Tahoma,
    Arial,
    sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(
        circle at center,
        #fffdf9 0%,
        #f8f1e3 63%,
        #eee1c7 100%
    );

    color:var(--text);
}

button,
input{
    font-family:inherit;
}

/* =========================
   PAGE
========================= */

.page{
    position:relative;

    width:100vw;
    height:100dvh;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:space-between;

    padding:8px 28px 6px;
}

/* =========================
   DECORATION
========================= */

.page::before{
    content:"";

    position:absolute;

    width:620px;
    height:340px;

    top:-205px;
    right:-140px;

    background:
    linear-gradient(
        145deg,
        var(--green-light),
        var(--green-dark)
    );

    border-radius:0 0 0 88%;

    transform:rotate(-7deg);

    box-shadow:
    0 14px 0 var(--gold);

    z-index:0;
}

.page::after{
    content:"";

    position:absolute;

    width:620px;
    height:340px;

    bottom:-220px;
    left:-140px;

    background:
    linear-gradient(
        145deg,
        var(--green-dark),
        var(--green-light)
    );

    border-radius:0 88% 0 0;

    transform:rotate(7deg);

    box-shadow:
    0 -14px 0 var(--gold);

    z-index:0;
}

/* =========================
   CORNER TEXT
========================= */

.corner-right,
.corner-left{
    position:absolute;

    z-index:2;

    color:var(--gold-light);

    font-size:16px;
    font-weight:800;

    line-height:1.5;
}

.corner-right{
    top:24px;
    right:34px;

    text-align:right;
}

.corner-left{
    bottom:26px;
    left:34px;

    text-align:left;
}

.corner-right::after,
.corner-left::after{
    content:"";

    display:block;

    width:52px;
    height:2px;

    margin-top:7px;

    background:var(--gold-light);
}

.corner-left::after{
    margin-right:auto;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;

    z-index:3;

    text-align:center;

    flex:none;
}

.logo{
    display:block;

    width:76px;
    height:76px;

    object-fit:contain;

    margin:0 auto 0;

    filter:
    drop-shadow(
        0 4px 8px rgba(0,0,0,.10)
    );
}

.title{
    color:var(--green);

    font-size:
    clamp(
        28px,
        3.4vw,
        46px
    );

    font-weight:900;

    line-height:1;

    margin-top:0;
}

.english-title{
    margin-top:3px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    color:var(--gold);

    font-size:
    clamp(
        13px,
        1.1vw,
        18px
    );

    font-weight:900;

    letter-spacing:.5px;
}

.english-title::before,
.english-title::after{
    content:"";

    width:48px;
    height:2px;
}

.english-title::before{
    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.english-title::after{
    background:
    linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}

/* =========================
   LOGIN AREA
========================= */

.login-area{
    position:relative;

    z-index:3;

    flex:1;

    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:4px 0;
}

/* =========================
   LOGIN CARD
========================= */

.login-card{
    position:relative;

    width:min(520px,92vw);

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.97),
        rgba(248,241,226,.97)
    );

    border:
    2px solid rgba(201,151,44,.50);

    border-radius:26px;

    padding:14px 24px 15px;

    box-shadow:
    0 0 0 5px rgba(255,243,206,.72),
    0 20px 42px rgba(0,76,63,.16);
}

.login-card::before{
    content:"";

    position:absolute;

    top:-3px;
    right:23%;
    left:23%;

    height:4px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

/* =========================
   ADMIN ICON
========================= */

.admin-icon{
    width:64px;
    height:64px;

    margin:0 auto 7px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #075243,
        #01362d
    );

    color:white;

    font-size:29px;

    border:
    4px solid var(--gold);

    box-shadow:
    0 0 0 4px rgba(255,222,131,.30),
    0 7px 18px rgba(0,76,63,.18);
}

.login-title{
    text-align:center;

    color:var(--green);

    font-size:21px;

    font-weight:900;
}

.login-subtitle{
    text-align:center;

    color:var(--muted);

    font-size:12px;

    line-height:1.5;

    margin:2px 0 10px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:8px;
}

.form-group label{
    display:block;

    margin-bottom:4px;

    color:var(--green);

    font-size:12px;

    font-weight:800;
}

.form-group input{
    width:100%;
    height:41px;

    border:
    1px solid #d7cbb4;

    border-radius:12px;

    outline:none;

    background:white;

    padding:0 13px;

    font-size:14px;

    transition:.2s ease;
}

.form-group input:focus{
    border-color:var(--gold);

    box-shadow:
    0 0 0 3px rgba(201,151,44,.14);
}

.login-btn{
    width:100%;
    height:43px;

    margin-top:1px;

    border:none;

    border-radius:13px;

    background:
    linear-gradient(
        145deg,
        var(--green-light),
        var(--green)
    );

    color:white;

    font-size:15px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 8px 18px rgba(0,76,63,.16);

    transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.login-btn:hover{
    transform:translateY(-1px);

    box-shadow:
    0 11px 22px rgba(0,76,63,.22);
}

.login-btn:disabled{
    opacity:.6;
    cursor:wait;
    transform:none;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:6px;

    padding:6px;

    border-radius:9px;

    text-align:center;

    font-size:12px;

    font-weight:800;
}

.message.error{
    display:block;

    background:#fdebea;

    color:var(--danger);
}

.message.success{
    display:block;

    background:#e9f7ee;

    color:var(--success);
}

/* =========================
   LEADERSHIP
========================= */

.leadership{
    position:relative;

    z-index:3;

    width:min(790px,86vw);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;

    flex:none;

    margin-bottom:1px;
}

.leader{
    position:relative;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.95),
        rgba(247,239,221,.95)
    );

    border:
    1px solid rgba(201,151,44,.45);

    border-radius:17px;

    padding:5px 10px;

    text-align:center;

    box-shadow:
    0 6px 16px rgba(72,56,20,.08);
}

.leader::before{
    content:"";

    position:absolute;

    top:-2px;
    right:27%;
    left:27%;

    height:3px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

.leader-role{
    color:#ae7b14;

    font-size:11px;

    font-weight:900;
}

.leader-name{
    margin-top:0;

    color:var(--green);

    font-size:13px;

    font-weight:900;
}

/* =========================
   CREDIT
========================= */

.credit{
    position:relative;

    z-index:4;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    color:var(--green-dark);

    font-size:13px;

    font-weight:900;

    padding:2px 12px;

    background:
    rgba(255,253,249,.82);

    border-radius:10px;

    flex:none;
}

.credit::before,
.credit::after{
    content:"";

    width:38px;
    height:2px;
}

.credit::before{
    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.credit::after{
    background:
    linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .page{
        padding:8px 12px 6px;
    }

    .corner-right,
    .corner-left{
        display:none;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .title{
        font-size:27px;
    }

    .english-title{
        font-size:12px;
    }

    .english-title::before,
    .english-title::after{
        width:30px;
    }

    .login-card{
        width:min(460px,92vw);

        padding:13px 16px 14px;
    }

    .admin-icon{
        width:58px;
        height:58px;

        font-size:26px;
    }

    .login-title{
        font-size:19px;
    }

    .leadership{
        width:94%;

        grid-template-columns:1fr 1fr;

        gap:8px;
    }

    .leader{
        padding:5px 6px;
    }

    .leader-role{
        font-size:10px;
    }

    .leader-name{
        font-size:12px;
    }

    .credit{
        font-size:12px;
    }
}

/* =========================
   VERY SHORT SCREENS
========================= */

@media(max-height:650px){

    .logo{
        width:60px;
        height:60px;
    }

    .title{
        font-size:25px;
    }

    .english-title{
        font-size:11px;
    }

    .login-card{
        padding:10px 20px 11px;
    }

    .admin-icon{
        width:52px;
        height:52px;

        font-size:23px;

        margin-bottom:4px;
    }

    .login-title{
        font-size:18px;
    }

    .login-subtitle{
        margin:1px 0 7px;

        font-size:11px;
    }

    .form-group{
        margin-bottom:6px;
    }

    .form-group input{
        height:37px;
    }

    .login-btn{
        height:39px;
    }

    .leader{
        padding:4px 8px;
    }

    .credit{
        font-size:11px;
        padding:1px 10px;
    }
}

</style>

</head>


<body>


<main class="page">


<div class="corner-right">

قيم<br>
معرفة<br>
مهارات<br>
مستقبل أفضل

</div>


<div class="corner-left">

بالعلم نصنع<br>
المستقبل

</div>


<!-- HEADER -->

<header class="header">

<img
src="logo.jpeg"
class="logo"
alt="شعار مدارس الفلاح الأهلية"
>

<h1 class="title">

إدارة الخطة الأسبوعية

</h1>

<div class="english-title">

Weekly Plan Administration

</div>

</header>


<!-- LOGIN -->

<section class="login-area">

<div class="login-card">


<div class="admin-icon">

🏫

</div>


<div class="login-title">

دخول الإدارة

</div>


<div class="login-subtitle">

أدخل اسم المستخدم وكلمة المرور للوصول إلى لوحة التحكم

</div>


<form id="loginForm">


<div class="form-group">

<label for="username">

اسم المستخدم

</label>

<input
type="text"
id="username"
placeholder="اسم المستخدم"
autocomplete="username"
required
>

</div>


<div class="form-group">

<label for="password">

كلمة المرور

</label>

<input
type="password"
id="password"
placeholder="كلمة المرور"
autocomplete="current-password"
required
>

</div>


<button
type="submit"
id="loginBtn"
class="login-btn"
>

دخول الإدارة

</button>


<div
id="message"
class="message"
></div>


</form>


</div>

</section>


<!-- LEADERSHIP -->

<section class="leadership">


<div class="leader">

<div class="leader-role">

المشرف العام

</div>

<div class="leader-name">

أحمد سمير

</div>

</div>


<div class="leader">

<div class="leader-role">

مدير المدرسة

</div>

<div class="leader-name">

عبد العزيز بن إبراهيم القحطاني

</div>

</div>


</section>


<!-- CREDIT -->

<div class="credit">

تصميم محمد عامر أحمد

</div>


</main>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBYxW_pdFvE1VZyDoTok4-EutPe6oigJhY",

    authDomain:
    "weekly-plan-3a743.firebaseapp.com",

    projectId:
    "weekly-plan-3a743",

    storageBucket:
    "weekly-plan-3a743.firebasestorage.app",

    messagingSenderId:
    "575884603803",

    appId:
    "1:575884603803:web:e8c4d82c69fd545bed313e"

};


const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);


const loginForm =
document.getElementById(
    "loginForm"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


const message =
document.getElementById(
    "message"
);


function showMessage(
    text,
    type
){

    message.textContent =
    text;

    message.className =
    "message " + type;

}


loginForm.addEventListener(
    "submit",
    async event=>{


        event.preventDefault();


        const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim()
        .toLowerCase();


        const password =
        document
        .getElementById(
            "password"
        )
        .value;


        if(
            !username ||
            !password
        ){

            showMessage(
                "أدخل اسم المستخدم وكلمة المرور",
                "error"
            );

            return;

        }


        if(
            username !==
            "admin"
        ){

            showMessage(
                "هذه الصفحة مخصصة لحساب الإدارة فقط",
                "error"
            );

            return;

        }


        loginBtn.disabled =
        true;


        loginBtn.textContent =
        "جاري تسجيل الدخول...";


        try{


            const email =
            "muhammadamer1618@gmail.com";


            const credential =
            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );


            const uid =
            credential.user.uid;


            const userSnapshot =
            await getDoc(

                doc(
                    db,
                    "users",
                    uid
                )

            );


            if(
                !userSnapshot.exists()
            ){

                await signOut(auth);

                showMessage(
                    "حساب الإدارة غير مسجل داخل النظام",
                    "error"
                );

                return;

            }


            const userData =
            userSnapshot.data();


            if(
                userData.active ===
                false
            ){

                await signOut(auth);

                showMessage(
                    "حساب الإدارة غير مفعل",
                    "error"
                );

                return;

            }


            if(
                userData.role !==
                "admin"
            ){

                await signOut(auth);

                showMessage(
                    "هذا الحساب لا يملك صلاحية الإدارة",
                    "error"
                );

                return;

            }


            sessionStorage.setItem(
                "weeklyPlanUserName",
                userData.name || ""
            );


            sessionStorage.setItem(
                "weeklyPlanUserRole",
                "admin"
            );


            sessionStorage.setItem(
                "weeklyPlanUserId",
                uid
            );


            showMessage(
                "تم تسجيل الدخول بنجاح",
                "success"
            );


            setTimeout(
                ()=>{

                    window.location.href =
                    "admin.html";

                },
                350
            );


        }


        catch(error){


            console.error(error);


            let text =
            "اسم المستخدم أو كلمة المرور غير صحيحة";


            if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                "تم إجراء محاولات كثيرة، حاول بعد قليل";

            }


            if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                "تعذر الاتصال بالإنترنت";

            }


            showMessage(
                text,
                "error"
            );


        }


        finally{


            loginBtn.disabled =
            false;


            loginBtn.textContent =
            "دخول الإدارة";


        }


    }
);


</script>


</body>

</html>
